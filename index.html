// ---------- A day ----------
function openDay(date) {
  S.cal.sel = date;
  const sh = openSheet({ title: E.fmtDayLong(date), onClose: () => { S.cal.sel = null; } });
  function draw() {
    const ls = S.logs.filter((l) => l.date === date);
    sh.body.innerHTML = ls.length ? `<ul class="loglist">${ls.map((l) => logRow(l)).join("")}</ul>` : `<p class="empty">${date > S.today ? "This day hasn't happened yet." : "Nothing logged. A rest day."}</p>`;
    $$("[data-act=open-log]", sh.body).forEach((b) => { b.onclick = () => openLogDetail(b.dataset.id, draw); });
  }
  draw();
  if (date <= S.today) {
    sh.setFoot(`<button class="btn red block" id="dy-log">${ICON.plus}Log for ${date === S.today ? "today" : esc(E.fmtDay(date))}</button>`);
    $("#dy-log", sh.foot).onclick = () => { sh.close(true); S.cal.sel = null; openLogSheet(date); };
  }
}

// ---------- One logged session ----------
function openLogDetail(id, onChange) {
  const l = S.logs.find((x) => x.id === id);
  if (!l) return;
  const sh = openSheet({ title: logTitle(l) });
  const meta = [E.TYPE_LABEL[l.type], E.fmtDayLong(l.date)];
  if (l.minutes) meta.push(E.fmtMinutes(l.minutes));
  let h = `<p class="detail-meta">${badge(l.type)}<span>${esc(meta.join(", "))}</span></p>`;
  if (l.type === "freestyle" && l.for) h += `<p class="lead">For ${esc(l.for)}</p>`;
  if (l.type === "bjj") h += `<p class="lead">${esc([l.bjj && l.bjj.kind, l.bjj && l.bjj.rounds ? plural(l.bjj.rounds, "round") + " rolled" : ""].filter(Boolean).join(", "))}</p>`;
  if (Array.isArray(l.items) && l.items.length) {
    h += `<ol class="dlist">${l.items.map((it) => {
      const sk = it.status === "skipped";
      const what = sk ? `Skipped${it.skipReason ? `: ${it.skipReason}` : ""}${it.skipNote ? `. ${it.skipNote}` : ""}` : E.setsSummary(it) || "Done";
      const extra = [];
      if (it.swappedFrom) extra.push(`Swapped in for ${(exById(it.swappedFrom) || {}).name || "another exercise"}`);
      if (it.added) extra.push("Added for this session");
      if (it.next === "up") extra.push("Go up next time");
      if (it.next === "hold") extra.push("Stay the same next time");
      return `<li class="${sk ? "is-skipped" : ""}"><span class="dl-name">${esc(it.name)}${!sk && it.target && it.target.change === "up" && it.target.delta ? ` <span class="tag up">${esc(it.target.delta)}</span>` : ""}</span><span class="dl-what">${esc(what)}</span>${it.note ? `<span class="dl-note">${esc(it.note)}</span>` : ""}${extra.length ? `<span class="dl-extra">${esc(extra.join(". "))}</span>` : ""}</li>`;
    }).join("")}</ol>`;
  }
  if (l.notes) h += `<div class="notes"><span class="field-l">Notes</span><p>${esc(l.notes)}</p></div>`;
  sh.body.innerHTML = h;
  sh.setFoot(`<button class="btn ghost danger-text" id="ld-del">${ICON.trash}Delete</button><button class="btn red" id="ld-edit">${ICON.pencil}Edit</button>`);
  $("#ld-edit", sh.foot).onclick = () => {
    if (Array.isArray(l.items) && ["workout", "physio", "stretch"].includes(l.type)) { closeAllSheets(); editLogSession(l); }
    else { sh.close(true); openActivityForm(l.type, { log: l }); }
  };
  $("#ld-del", sh.foot).onclick = async () => {
    if (!(await confirmBox({ title: `Delete ${logTitle(l)}?`, body: `${E.fmtDayLong(l.date)}. This can't be undone after the next few seconds.`, ok: "Delete", danger: true }))) return;
    try { await removeLog(l.id); } catch (e) { return saveErr(e); }
    sh.close(true); if (onChange) onChange(); render();
    toast(`${logTitle(l)} deleted`, { label: "Undo", run: async () => { try { await putLog(l); } catch (e) { return saveErr(e); } if (onChange) onChange(); render(); } });
  };
}

/* Progress: every exercise you've logged, how far it's come, and its full history. */
function progressRows() {
  const map = new Map();
  for (const l of S.logs) for (const it of l.items || []) { if (!it || !it.exId) continue; if (!map.has(it.exId)) map.set(it.exId, []); map.get(it.exId).push({ log: l, item: it }); }
  const rows = [];
  for (const [id, entries] of map) {
    const done = entries.filter((e) => E.performed(e.item));
    const last = done.length ? done[done.length - 1] : entries[entries.length - 1];
    const ex = exById(id);
    const kind = ex ? ex.kind : last.log.type === "physio" || last.log.type === "stretch" ? last.log.type : "workout";
    rows.push({ id, name: ex ? ex.name : last.item.name, kind, last, ps: E.progressSummary(entries), sessions: done.length, date: last.log.date });
  }
  return rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.name.localeCompare(b.name)));
}
function progressList() {
  const k = S.progQ.trim().toLowerCase();
  const rows = progressRows().filter((r) => !k || r.name.toLowerCase().includes(k));
  if (!rows.length) return `<p class="empty">${k ? "No exercise matches that." : "Log a workout and each exercise's progress shows up here."}</p>`;
  const one = (r) => {
    const what = E.performed(r.last.item) ? E.setsSummary(r.last.item) : "Skipped";
    const d = r.ps && r.ps.delta && !/^[+−]0(\D|$)/.test(r.ps.delta) ? `<span class="pr-delta${r.ps.delta.startsWith("−") ? " down" : ""}">${esc(r.ps.delta)}</span>` : "";
    return `<li><button class="lrow" data-act="ex-detail" data-id="${esc(r.id)}"><span class="lr-main"><strong>${esc(r.name)}</strong><span>${esc(E.fmtMD(r.date))}: ${esc(what)}</span></span>${d}${ICON.right}</button></li>`;
  };
  const kinds = E.EX_KINDS.filter((k) => rows.some((r) => r.kind === k));
  if (kinds.length < 2) return `<ul class="loglist">${rows.map(one).join("")}</ul>`;
  return kinds.map((k) => `<section class="sect"><h2 class="h2">${EX_KIND_HEAD[k]}</h2><ul class="loglist">${rows.filter((r) => r.kind === k).map(one).join("")}</ul></section>`).join("");
}
function viewProgress() {
  return `<h1 class="page-h">Progress</h1>
    <label class="search">${ICON.search}<input id="pg-q" type="search" placeholder="Find an exercise" autocomplete="off" value="${esc(S.progQ)}" aria-label="Find an exercise"></label>
    <div id="pg-list">${progressList()}</div>`;
}
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "pg-q") { S.progQ = e.target.value; const l = $("#pg-list"); if (l) l.innerHTML = progressList(); }
});
ACT["ex-detail"] = (el) => openExerciseDetail(el.dataset.id);

// The heaviest weight (or longest hold, or most reps) of each session
function sessionValue(it) {
  const done = (it.sets || []).filter((s) => s && s.done);
  const pick = (k) => { const v = done.map((s) => E.num(s[k])).filter((x) => x !== null); return v.length ? Math.max(...v) : null; };
  const load = pick("load"); if (load !== null) return { v: load, unit: "lb" };
  const secs = pick("secs"); if (secs !== null) return { v: secs, unit: "s" };
  const reps = pick("reps"); if (reps !== null) return { v: reps, unit: "reps" };
  return null;
}
function sparkline(entries) {
  const pts = entries.filter((e) => E.performed(e.item)).map((e) => ({ d: e.log.date, x: sessionValue(e.item) })).filter((p) => p.x);
  if (pts.length < 2) return "";
  const unit = pts[pts.length - 1].x.unit, ps = pts.filter((p) => p.x.unit === unit);
  if (ps.length < 2) return "";
  const W = 320, H = 72, pad = 6;
  const vs = ps.map((p) => p.x.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const xy = ps.map((p, i) => [pad + (i * (W - 2 * pad)) / (ps.length - 1), H - pad - ((p.x.v - lo) * (H - 2 * pad)) / span]);
  const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const [lx, ly] = xy[xy.length - 1];
  const label = `${unit === "lb" ? "Top weight" : unit === "s" ? "Longest hold" : "Most reps"} each session, from ${E.fmtNum(vs[0])} to ${E.fmtNum(vs[vs.length - 1])}${unit === "reps" ? " reps" : unit} over ${ps.length} sessions`;
  return `<figure class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"><polyline points="${line}" fill="none" vector-effect="non-scaling-stroke"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4"/></svg><figcaption><span>${esc(E.fmtMD(ps[0].d))}</span><span>${esc(unit === "lb" ? "Top weight per session" : unit === "s" ? "Longest hold per session" : "Most reps per session")}</span><span>${esc(E.fmtMD(ps[ps.length - 1].d))}</span></figcaption></figure>`;
}
function openExerciseDetail(id) {
  const entries = E.exerciseHistory(S.logs, id);
  if (!entries.length) return;
  const ex = exById(id), name = ex ? ex.name : entries[entries.length - 1].item.name;
  const ps = E.progressSummary(entries);
  const sh = openSheet({ title: name, tall: true });
  const where = S.plan.routines.filter((r) => r.slots.some((s) => s.exId === id)).map((r) => r.name);
  let h = "";
  if (ps) h += `<div class="stats"><div><span>First</span><strong>${esc(ps.from)}</strong><small>${esc(E.fmtMD(ps.since))}</small></div><div><span>Now</span><strong>${esc(ps.to)}</strong><small>${plural(ps.sessions, "session")}</small></div><div><span>Change</span><strong>${esc(ps.delta)}</strong><small>${esc(ps.pct)}, ${esc(ps.mult)}</small></div></div>`;
  h += sparkline(entries);
  if (where.length) h += `<p class="muted small">In ${esc(listJoin(where))}.</p>`;
  h += `<h3 class="h3 sec">History</h3><ol class="dlist">${entries.slice().reverse().map((e) => {
    const sk = !E.performed(e.item);
    const what = sk ? `Skipped${e.item.skipReason ? `: ${e.item.skipReason}` : ""}${e.item.skipNote ? `. ${e.item.skipNote}` : ""}` : E.setsSummary(e.item);
    return `<li class="${sk ? "is-skipped" : ""}"><span class="dl-name">${esc(E.fmtDay(e.log.date))}<span class="muted"> ${esc(e.log.title || "")}</span>${!sk && e.item.target && e.item.target.change === "up" && e.item.target.delta ? ` <span class="tag up">${esc(e.item.target.delta)}</span>` : ""}</span><span class="dl-what">${esc(what)}</span>${e.item.note ? `<span class="dl-note">${esc(e.item.note)}</span>` : ""}</li>`;
  }).join("")}</ol>`;
  sh.body.innerHTML = h;
}

/* Plan: the split, routines (workouts, physio, stretching), exercises and how each one progresses. */
const KIND_HEAD = { workout: "Workouts", physio: "Physio", stretch: "Stretching" };
const KIND_NEW = { workout: "New workout", physio: "New physio routine", stretch: "New stretch routine" };

function viewPlan() {
  const info = splitInfo(), split = S.plan.split, workouts = routinesOf("workout");
  let h = `<h1 class="page-h">Plan</h1>`;
  h += `<section class="sect">
    <div class="block-head"><h2 class="h2">Your split</h2></div>
    ${split.length ? `<ol class="splitlist">${split.map((x, i) => { const r = rtById(x.routineId), nm = esc(r.name); return `<li class="${i === info.next ? "is-next" : ""}"><span class="sl-n">${i + 1}</span><span class="sl-name">${nm}${i === info.next ? ` <span class="tag next">Next</span>` : ""}</span><span class="sl-btns"><button class="icon-btn sm" data-act="split-move" data-i="${i}" data-d="-1" aria-label="Move ${nm} up"${i === 0 ? " disabled" : ""}>${ICON.up}</button><button class="icon-btn sm" data-act="split-move" data-i="${i}" data-d="1" aria-label="Move ${nm} down"${i === split.length - 1 ? " disabled" : ""}>${ICON.down}</button><button class="icon-btn sm" data-act="split-remove" data-i="${i}" aria-label="Take ${nm} out of the split">${ICON.x}</button></span></li>`; }).join("")}</ol>`
      : `<p class="empty">Your split is the order you rotate through your workouts. Add them in order and Today always loads the next one.</p>`}
    <div class="row-btns">${workouts.length ? `<button class="btn ghost sm" data-act="split-add">${ICON.plus}Add a workout</button>` : ""}${split.length > 1 ? `<button class="btn ghost sm" data-act="change-next">Choose what's next</button>` : ""}</div>
  </section>`;
  for (const kind of E.ROUTINE_KINDS) {
    const list = routinesOf(kind);
    h += `<section class="sect">
      <div class="block-head"><h2 class="h2">${KIND_HEAD[kind]}</h2><button class="btn ghost sm" data-act="new-routine" data-kind="${kind}">${ICON.plus}New</button></div>
      ${list.length ? `<ul class="loglist">${list.map((r) => {
        const names = r.slots.map((s) => (exById(s.exId) || {}).name).filter(Boolean);
        const sub = names.length ? `${names.slice(0, 3).join(", ")}${names.length > 3 ? `, ${names.length - 3} more` : ""}` : `No ${kind === "stretch" ? "stretches" : "exercises"} yet`;
        return `<li><button class="lrow" data-act="edit-routine" data-rt="${esc(r.id)}">${badge(kind)}<span class="lr-main"><strong>${esc(r.name)}</strong><span>${esc(sub)}</span></span>${ICON.right}</button></li>`;
      }).join("")}</ul>` : `<p class="empty">${kind === "workout" ? "No workouts yet." : kind === "physio" ? "Add the exercises your physio gave you, with their own progressions." : "Add your stretches and they load in order each time."}</p>`}
      ${kind === "workout" && !list.length ? `<button class="btn red" data-act="starter">Use a starter split</button>` : ""}
    </section>`;
  }
  h += `<section class="sect"><div class="block-head"><h2 class="h2">Exercises</h2><span class="muted">${S.plan.exercises.length}</span></div><button class="btn ghost block" data-act="exercises">Rename or change exercises</button></section>`;
  return h;
}

ACT["split-move"] = (el) => {
  const i = Number(el.dataset.i), j = i + Number(el.dataset.d), sp = S.plan.split;
  if (j < 0 || j >= sp.length) return;
  [sp[i], sp[j]] = [sp[j], sp[i]];
  S.plan.splitOverride = null; savePlan(); render();
  const b = $(`[data-act="split-move"][data-i="${j}"][data-d="${el.dataset.d}"]`) || $(`[data-act="split-move"][data-i="${j}"]`); if (b && !b.disabled) b.focus();
};

  const i = Number(el.dataset.i), prev = clone(S.plan.split), prevOv = S.plan.splitOverride, r = rtById(S.plan.split[i].routineId);
  S.plan.split.splice(i, 1); S.plan.splitOverride = null; savePlan(); render();
  toast(`${r.name} taken out of the split`, { label: "Undo", run: () => { S.plan.split = prev; S.plan.splitOverride = prevOv; savePlan(); render(); } });
};
ACT["split-add"] = () => {
  choiceSheet("Add to your split", routinesOf("workout").map((r) => [r.id, r.name, `${kindNoun("workout", r.slots.length)}${S.plan.split.some((x) => x.routineId === r.id) ? ", already in it" : ""}`, "workout"]), (id) => {
    S.plan.split.push({ routineId: id }); savePlan(); render();
  });
};
ACT["new-routine"] = (el) => newRoutine(el.dataset.kind || "workout");
ACT["edit-routine"] = (el) => editRoutine(el.dataset.rt);
ACT.starter = () => openStarter();

function newRoutine(kind) {
  const sh = openSheet({ title: KIND_NEW[kind], focus: true });
  const ph = kind === "workout" ? "Push, Upper A, Legs…" : kind === "physio" ? "Knee rehab" : "Evening stretch";
  sh.body.innerHTML = field("Name", `<input id="nr-name" maxlength="60" autocomplete="off" placeholder="${ph}">`) +
    (kind === "workout" ? `<label class="check"><input type="checkbox" id="nr-split" checked><span>Add it to the end of my split</span></label>` : "") + `<p class="form-err" id="nr-err" role="alert" hidden></p>`;
  sh.setFoot(`<button class="btn red block" id="nr-go">Create</button>`);
  const inp = $("#nr-name", sh.body);
  setTimeout(() => inp.focus(), 60);
  const go = () => {
    const name = inp.value.trim();

function openStarter() {
  const sh = openSheet({ title: "Starter splits" });
  sh.body.innerHTML = `<p class="lead">Pick one to start from. You can rename, swap and change anything after.</p>
    <div class="choices">${E.TEMPLATES.map((t) => `<button class="choice" data-k="${t.key}">${badge("workout")}<span class="choice-main"><strong>${esc(t.name)}</strong><span>${esc(t.routines.map((r) => r[1].map((x) => x[0]).slice(0, 2).join(", ") + "…").join(" / "))}</span></span>${ICON.right}</button>`).join("")}</div>
    <p class="muted small">Weights start blank. Enter what you lift in your first session and it goes up from there.</p>`;
  $$("[data-k]", sh.body).forEach((b) => {

// ---------- Routine editor ----------
function editRoutine(id) {
  const rt = rtById(id);
  if (!rt) return;
  const sh = openSheet({ title: rt.name, tall: true, onClose: () => render() });
  const noun = rt.kind === "stretch" ? "stretch" : "exercise";
  function draw() {
    if (!rtById(id)) return sh.close(true);
    sh.setTitle(rt.name);
    const inSplit = S.plan.split.some((x) => x.routineId === rt.id);
    sh.body.innerHTML = `${field("Name", `<input id="re-name" maxlength="60" autocomplete="off" value="${esc(rt.name)}">`)}
      <div class="block-head"><h3 class="h3">${rt.kind === "stretch" ? "Stretches" : "Exercises"}</h3><span class="muted">${rt.slots.length}</span></div>
      ${rt.slots.length ? `<ol class="slotlist">${rt.slots.map((slot, i) => slotRow(rt, slot, i)).join("")}</ol>` : `<p class="empty">No ${noun === "stretch" ? "stretches" : "exercises"} yet.</p>`}
      <button class="btn ghost block" data-x="add">${ICON.plus}Add ${noun === "stretch" ? "a stretch" : "an exercise"}</button>
      ${rt.kind !== "stretch" && rt.slots.length > 1 ? `<button class="btn ghost block" data-x="prog-all">Change when everything goes up</button>` : ""}
      ${rt.kind === "workout" ? `<p class="muted small">${inSplit ? "In your split." : "Not in your split. Add it from Plan."}</p>` : ""}
      <button class="btn ghost danger-text block" data-x="delete">${ICON.trash}Delete ${esc(rt.name)}</button>`;
    const nm = $("#re-name", sh.body);
    nm.onchange = () => { const v = nm.value.trim(); if (v && v !== rt.name) { rt.name = v.slice(0, 60); savePlan(); sh.setTitle(rt.name); if (S.draft && S.draft.routineId === rt.id) { S.draft.title = rt.name; saveDraftSoon(); } } else nm.value = rt.name; };
    nm.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); nm.blur(); } };
    $$("[data-x]", sh.body).forEach((b) => {
      b.onclick = () => {
        const x = b.dataset.x, i = Number(b.dataset.i);
        if (x === "slot") editSlot(rt, rt.slots[i].id, draw);
        else if (x === "up" || x === "down") {
          const j = x === "up" ? i - 1 : i + 1;
          if (j < 0 || j >= rt.slots.length) return;
          [rt.slots[i], rt.slots[j]] = [rt.slots[j], rt.slots[i]];
          savePlan(); draw();
          const f = $(`[data-x="${x}"][data-i="${j}"]`, sh.body); if (f && !f.disabled) f.focus();
        } else if (x === "add") {
          pickExercise({ title: noun === "stretch" ? "Add a stretch" : "Add an exercise", kind: rt.kind }, (ex) => {
            const slot = E.newSlot(ex.id, slotDefaults(ex, rt.kind), S.settings);
            if (rt.kind === "physio") slot.prog.when = "manual";
            rt.slots.push(slot); savePlan(); draw();
            editSlot(rt, slot.id, draw);
          });
        } else if (x === "prog-all") progressAll(rt, draw);
        else if (x === "delete") deleteRoutine(rt, sh);
      };
    });
  }
  sh.setFoot(`<button class="btn ghost" data-close>Done</button><button class="btn red" id="re-start">${ICON.play}Start ${esc(rt.name)}</button>`);
  $("[data-close]", sh.foot).onclick = () => sh.close();
  $("#re-start", sh.foot).onclick = () => { if (!rt.slots.length) return toast(`Add ${noun === "stretch" ? "stretches" : "exercises"} first.`); sh.close(true); startSession(rt.id, S.today); };
  draw();
}
function slotRow(rt, slot, i) {
  const ex = exById(slot.exId);
  const t = targetFor(slot, ex, S.today, { fallback: true });
  const nm = esc(ex.name);
  const next = ex.type === "weights" ? (t.load !== null ? `${E.fmtNum(t.load)} lb next` : "No weight yet") : "";
  const prog = rt.kind === "stretch" && t.how === "none" ? "" : E.progLabel(slot.prog, ex, S.settings);
  return `<li class="slot"><button class="slot-main" data-x="slot" data-i="${i}"><strong>${nm}</strong><span>${esc(E.prescription(t, ex.side))}${next ? `, ${esc(next)}` : ""}</span>${prog ? `<span class="slot-prog">${esc(prog)}</span>` : ""}</button>
    <span class="slot-move"><button class="icon-btn sm" data-x="up" data-i="${i}" aria-label="Move ${nm} up"${i === 0 ? " disabled" : ""}>${ICON.up}</button><button class="icon-btn sm" data-x="down" data-i="${i}" aria-label="Move ${nm} down"${i === rt.slots.length - 1 ? " disabled" : ""}>${ICON.down}</button></span></li>`;
}
// One cadence for every exercise in a routine (exercises that don't progress are left alone)
function progressAll(rt, onDone) {
  choiceSheet(`When should ${rt.name} go up?`, E.WHEN_OPTIONS.map(([k, l]) => [k, l, k.startsWith("range") ? "Weighted exercises only" : ""]), (k) => {
    const [when, n] = k.split("-");
    let changed = 0;
    for (const slot of rt.slots) {
      const ex = exById(slot.exId);
      const np = E.normProg(slot.prog, ex && ex.type);
      if (np.how === "none" || (when === "range" && !(np.how === "load" || (np.how === "steps" && ex && ex.type !== "timed")))) continue;
      slot.prog.when = when; slot.prog.every = Number(n) || 1; changed++;
    }
    savePlan(); onDone();
    const label = E.WHEN_OPTIONS.find((o) => o[0] === k)[1];
    toast(changed ? `${plural(changed, "exercise")} in ${rt.name}: ${label.charAt(0).toLowerCase() + label.slice(1)}` : "Nothing changed");
  });
}
async function deleteRoutine(rt, sh) {
  if (!(await confirmBox({ title: `Delete ${rt.name}?`, body: "Sessions you've logged stay in your history and calendar.", ok: "Delete", danger: true }))) return;
  const before = { routines: clone(S.plan.routines), split: clone(S.plan.split), ov: S.plan.splitOverride };
  S.plan.routines = S.plan.routines.filter((r) => r.id !== rt.id);
  S.plan.split = S.plan.split.filter((x) => x.routineId !== rt.id);
  S.plan.splitOverride = null;
  savePlan(); sh.close(true); render();
  toast(`${rt.name} deleted`, { label: "Undo", run: () => { S.plan.routines = before.routines; S.plan.split = before.split; S.plan.splitOverride = before.ov; savePlan(); render(); } });
}

// ---------- One exercise in a routine: amounts and progression ----------
const HOW_CHOICES = {
  weights: [["load", "Add weight"], ["reps", "Add reps"], ["steps", "Custom steps"], ["none", "Don't progress"]],
  bodyweight: [["reps", "Add reps"], ["steps", "Custom steps"], ["none", "Don't progress"]],
  timed: [["time", "Add time"], ["steps", "Custom steps"], ["none", "Don't progress"]]
};
const KIND_CHOICES = [["free", "Free weight"], ["machine", "Machine"], ["bodyweight", "Bodyweight"], ["timed", "Timed hold"]];
const kindOf = (type, equip) => (type === "weights" ? (equip === "machine" ? "machine" : "free") : type);

function editSlot(rt, slotId, onDone) {
  const slot = rt.slots.find((x) => x.id === slotId);
  const ex = slot && exById(slot.exId);
  if (!ex) return;
  const t0 = targetFor(slot, ex, S.today, { fallback: true });
  const p0 = E.normProg(slot.prog, ex.type);
  const w = {
    name: ex.name, kind: kindOf(ex.type, ex.equip), side: ex.side, note: slot.note || "",
    sets: t0.how === "steps" ? E.clampSets(slot.sets) : t0.sets, rmin: (t0.reps || slot.reps || { min: 8 }).min, rmax: (t0.reps || slot.reps || { max: 12 }).max,
    secs: t0.secs !== null ? t0.secs : (slot.secs !== null ? slot.secs : 30), load: t0.load,
    how: p0.how, when: p0.when, every: p0.every, by: slot.prog.by, hold: p0.hold, steps: clone(p0.steps), step: t0.step, loop: p0.loop, plate: p0.plate
  };
  if (t0.how === "steps" && t0.reps) { w.rmin = slot.reps ? slot.reps.min : w.rmin; w.rmax = slot.reps ? slot.reps.max : w.rmax; }
  const sh = openSheet({ title: ex.name, tall: true });
  const typeOf = () => (w.kind === "free" || w.kind === "machine" ? "weights" : w.kind);
  const loopOn = () => w.how === "steps" && w.loop && typeOf() === "weights";
  const plateOn = () => E.plateMode({ how: w.how, loop: loopOn(), plate: w.plate, by: w.by }, { type: typeOf(), equip: w.kind === "machine" ? "machine" : "free" }, S.settings);
  const unit = () => (w.how === "load" || loopOn() ? "lb" : w.how === "reps" ? "reps" : "s");
  function defaultBy() { return w.how === "load" || loopOn() ? (w.kind === "machine" ? S.settings.inc.machine : S.settings.inc.free) : w.how === "reps" ? 1 : 5; }
  function fixHow() {
    const ok = HOW_CHOICES[typeOf()].map((x) => x[0]);
    if (!ok.includes(w.how)) w.how = E.defaultHow(typeOf());
    if (w.when === "range" && !(w.how === "load" || (w.how === "steps" && typeOf() !== "timed"))) w.when = "weeks";
    if (w.how === "steps" && !w.steps.length) {
      const timed = typeOf() === "timed", lo = Math.round(w.rmin || 8), hi = Math.round(w.rmax || lo);
      if (typeOf() === "weights" && hi > lo && hi - lo <= 7) {
        // A rep range becomes a ladder: 6, 7, 8 reps, then more weight and back to 6
        w.steps = [];
        for (let r = lo; r <= hi; r++) w.steps.push({ sets: w.sets, reps: { min: r, max: r }, secs: null, load: null });
        w.loop = true;
      } else w.steps = [{ sets: w.sets, reps: timed ? null : { min: lo, max: lo }, secs: timed ? w.secs : null, load: null }, { sets: w.sets, reps: timed ? null : { min: lo + 2, max: lo + 2 }, secs: timed ? w.secs + 10 : null, load: null }];
      w.step = 0;
    }
  }
  function stepText(st) { return `${st.sets} × ${typeOf() === "timed" ? E.fmtSecs(st.secs) : E.fmtReps(st.reps)}${st.load !== null && st.load !== undefined && typeOf() === "weights" && !loopOn() ? ` at ${E.fmtNum(st.load)} lb` : ""}`; }
  function draw() {
    fixHow();
    const type = typeOf(), timed = type === "timed";
    const whenOpts = E.WHEN_OPTIONS.filter(([k]) => !(k.startsWith("range") && !(w.how === "load" || (w.how === "steps" && !timed))));
    const whenKey = `${w.when}-${w.when === "weeks" || w.when === "sessions" ? w.every : 1}`;
    const amounts = w.how === "steps" ? "" : `<div class="amounts">
        ${field("Sets", `<span class="stepper"><button type="button" class="icon-btn sm" data-w="sets-" aria-label="One less set">${ICON.minus}</button><input id="se-sets" inputmode="numeric" pattern="[0-9]*" value="${w.sets}" aria-label="Sets"><button type="button" class="icon-btn sm" data-w="sets+" aria-label="One more set">${ICON.plus}</button></span>`)}
        ${timed ? field("Seconds", `<span class="unit-in"><input id="se-secs" inputmode="numeric" pattern="[0-9]*" value="${esc(w.secs)}"><span>s</span></span>`)
          : `<div class="field"><span class="field-l">Reps</span><span class="range-in"><input id="se-rmin" inputmode="numeric" pattern="[0-9]*" value="${esc(w.rmin)}" aria-label="Fewest reps"><span>to</span><input id="se-rmax" inputmode="numeric" pattern="[0-9]*" value="${esc(w.rmax)}" aria-label="Most reps"></span></div>`}
      </div>`;
    const load = type === "weights" ? field(t0.plateUp ? "Weight now" : "Weight next time", `<span class="unit-in"><input id="se-load" inputmode="decimal" value="${w.load === null ? "" : esc(E.fmtNum(w.load))}" placeholder="Not set"><span>lb</span></span>`, t0.plateUp ? "Next session goes up one plate from this. If you know the new weight, type it here instead." : w.how === "steps" && !loopOn() ? "Used by any step without its own weight." : "") : "";
    const steps = w.how !== "steps" ? "" : `<div class="field"><span class="field-l">Steps</span>${timed ? "" : `<span class="field-h">Sets × reps. Fill in the second reps box for a range, like 8 to 12.</span>`}<ol class="steps">${w.steps.map((st, k) => `<li class="steprow" data-k="${k}"><span class="step-n">${k + 1}</span>
        <input data-st="sets" inputmode="numeric" pattern="[0-9]*" value="${st.sets}" aria-label="Step ${k + 1} sets"><span class="x">×</span>
        ${timed ? `<span class="unit-in sm"><input data-st="secs" inputmode="numeric" pattern="[0-9]*" value="${esc(st.secs === null ? "" : st.secs)}" aria-label="Step ${k + 1} seconds"><span>s</span></span>`
          : `<span class="range-in sm"><input data-st="rmin" inputmode="numeric" pattern="[0-9]*" value="${esc(st.reps ? st.reps.min : "")}" aria-label="Step ${k + 1} reps, or the bottom of a range"><span>to</span><input data-st="rmax" inputmode="numeric" pattern="[0-9]*" value="${esc(st.reps && st.reps.max !== st.reps.min ? st.reps.max : "")}" placeholder="—" aria-label="Step ${k + 1} top of the rep range (optional)"></span>`}
        ${type === "weights" && !loopOn() ? `<span class="unit-in sm"><input data-st="load" inputmode="decimal" value="${esc(st.load === null || st.load === undefined ? "" : E.fmtNum(st.load))}" placeholder="—" aria-label="Step ${k + 1} weight"><span>lb</span></span>` : ""}
        <button type="button" class="icon-btn sm" data-w="step-del" data-k="${k}" aria-label="Remove step ${k + 1}"${w.steps.length < 2 ? " disabled" : ""}>${ICON.x}</button></li>`).join("")}</ol>
        <button type="button" class="link" data-w="step-add">${ICON.plus}Add a step</button></div>
      ${type === "weights" ? `<div class="field"><span class="field-l">After the last step</span>${chips("loop", [["stay", "Stay there"], ["loop", "Add weight, start over"]], w.loop ? "loop" : "stay")}</div>` : ""}
      ${field("Next session", `<select id="se-step">${w.steps.map((st, k) => `<option value="${k}"${k === w.step ? " selected" : ""}>Step ${k + 1}: ${esc(stepText(st))}</option>`).join("")}</select>`)}`;
    const prog = `<div class="field"><span class="field-l">How it goes up</span>${chips("how", HOW_CHOICES[type], w.how)}</div>
      ${steps}
      ${w.how === "none" ? "" : field("When", `<select id="se-when">${whenOpts.map(([k, l]) => `<option value="${k}"${k === whenKey ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`)}
      ${(w.how === "load" || loopOn()) ? `<div class="field"><span class="field-l">${loopOn() ? "Weight added after the last step" : "Each time, add"}</span>${chips("inc", [["amount", "An amount"], ["plate", "Next plate"]], plateOn() ? "plate" : "amount")}</div>
        ${plateOn() ? `<p class="muted small">When it's time to go up, it says Next plate. Type the new weight in that session and it goes on from there.</p>` : field("Amount", `<span class="unit-in"><input id="se-by" inputmode="decimal" value="${w.by ? esc(E.fmtNum(w.by)) : ""}" placeholder="${esc(E.fmtNum(defaultBy()))}"><span>lb</span></span>`, `Leave blank to use your ${w.kind === "machine" ? "machine" : "free-weight"} default (${E.fmtNum(defaultBy())} lb, in Settings).`)}`
        : ["reps", "time"].includes(w.how) ? field("Each time, add", `<span class="unit-in"><input id="se-by" inputmode="decimal" value="${w.by ? esc(E.fmtNum(w.by)) : ""}" placeholder="${esc(E.fmtNum(defaultBy()))}"><span>${unit()}</span></span>`) : ""}
      ${w.how === "none" || w.when === "manual" ? "" : `<label class="check"><input type="checkbox" id="se-hold"${w.hold ? " checked" : ""}><span>${timed ? "Hold if I cut a set short" : "Hold if I miss reps"}</span></label>`}
      ${w.when === "manual" && w.how !== "none" ? `<p class="muted small">In a session, set Next time to Go up when you're ready.</p>` : ""}`;
    sh.setTitle(w.name || ex.name);
    sh.body.innerHTML = `${field("Name", `<input id="se-name" maxlength="80" autocomplete="off" value="${esc(w.name)}">`, "Renames it everywhere it's used.")}
      <div class="field"><span class="field-l">Kind</span>${chips("kind", KIND_CHOICES, w.kind)}</div>
      <label class="check"><input type="checkbox" id="se-side"${w.side ? " checked" : ""}><span>Each side</span></label>
      ${w.how !== "steps" ? `<h3 class="h3 sec">Sets and reps</h3>` : type === "weights" ? `<h3 class="h3 sec">Weight</h3>` : ""}${amounts}${load}
      <h3 class="h3 sec">Progression</h3>${prog}
      ${field("Note", `<input id="se-note" maxlength="200" autocomplete="off" value="${esc(w.note)}" placeholder="Seat 4, wide grip…">`, "Shows on this exercise in your session.")}
      <button type="button" class="btn ghost block" data-w="swap">${ICON.swap}Swap for a different exercise</button>
      <p class="form-err" id="se-err" role="alert" hidden></p>`;
    wireChips(sh.body, "kind", (v) => { read(); w.kind = v; if (typeOf() !== "weights") w.load = null; draw(); });
    wireChips(sh.body, "how", (v) => { read(); w.how = v; draw(); });
    wireChips(sh.body, "loop", (v) => { read(); w.loop = v === "loop"; draw(); });
    wireChips(sh.body, "inc", (v) => { read(); w.plate = v === "plate"; draw(); });
    const whenSel = $("#se-when", sh.body);
    if (whenSel) whenSel.onchange = () => { read(); const [k, n] = whenSel.value.split("-"); w.when = k; w.every = Number(n) || 1; draw(); };
    $$("[data-w]", sh.body).forEach((b) => {
      b.onclick = () => {

        else if (a === "step-del") { w.steps.splice(Number(b.dataset.k), 1); w.step = Math.min(w.step, w.steps.length - 1); }

  }
  // Pull what's typed into the working copy
  function read() {
    const v = (id) => { const e = $(id, sh.body); return e ? e.value.trim() : null; };

    if (v("#se-secs") !== null) w.secs = E.num(v("#se-secs"));

    if (v("#se-note") !== null) w.note = v("#se-note");
    const stepSel = $("#se-step", sh.body); if (stepSel) w.step = Number(stepSel.value) || 0;
    $$(".steprow", sh.body).forEach((row) => {
      const st = w.steps[Number(row.dataset.k)]; if (!st) return;
      const g = (k) => { const e = $(`[data-st="${k}"]`, row); return e ? E.num(e.value) : undefined; };
      if (g("sets") !== undefined && g("sets") !== null) st.sets = E.clampSets(g("sets"));
      if (g("secs") !== undefined) st.secs = g("secs");

  }
  function err(m) { const e = $("#se-err", sh.body); e.textContent = m; e.hidden = !m; if (m) e.scrollIntoView({ block: "nearest" }); }
  function save() {
    read();
    const type = typeOf(), timed = type === "timed";
    if (!w.name) return err("Give the exercise a name.");
    if (w.how !== "steps") {
      if (timed && (w.secs === null || w.secs < 1)) return err("Enter how many seconds.");

    } else {
      if (w.steps.some((st) => (timed ? !(st.secs >= 1) : !st.reps))) return err(timed ? "Each step needs its seconds." : "Each step needs its reps.");
    }
    if (w.load !== null && (w.load < 0 || w.load > 2000)) return err("Check the weight.");
    // The exercise itself (shared by every routine that uses it)
    const oldType = ex.type;
    ex.name = w.name.slice(0, 80); ex.type = type; ex.equip = type === "weights" ? (w.kind === "machine" ? "machine" : "free") : null; ex.side = w.side;
    // Its place in this routine
    const reps = timed ? null : E.normReps({ min: w.rmin, max: w.rmax === null ? w.rmin : w.rmax });
    const secs = timed ? Math.round(w.secs || 30) : null;
    const prog = { how: w.how, when: w.how === "none" ? "weeks" : w.when, every: w.every, by: w.by, hold: w.hold, steps: w.how === "steps" ? E.normSteps(w.steps) : (slot.prog.steps || []), loop: w.how === "steps" && type === "weights" && !!w.loop, plate: w.plate === true ? true : w.plate === false ? false : null };
    const np = E.normProg(prog, type);
    const t = E.snapshot(t0);
    const changed = oldType !== type || np.how !== p0.how
      || (type === "weights" && !E.eqNum(w.load, t.load))
      || (np.how === "reps" && (!t.reps || !reps || reps.min !== t.reps.min || reps.max !== t.reps.max))
      || (np.how === "time" && !E.eqNum(secs, t.secs))
      || (np.how === "steps" && w.step !== t.step);
    slot.sets = w.how === "steps" ? slot.sets : E.clampSets(w.sets);
    if (w.how !== "steps") { slot.reps = reps; slot.secs = secs; }
    if (changed) { slot.load = type === "weights" ? w.load : null; slot.step = w.how === "steps" ? w.step : 0; slot.at = nowISO(); if (w.how !== "steps") { slot.reps = reps; slot.secs = secs; } }
    slot.prog = prog; slot.note = w.note.slice(0, 200);
    savePlan(); sh.close(true);
    if (onDone) onDone();
    toast(`${ex.name} saved`);
  }
  sh.setFoot(`<button class="btn ghost danger-text" id="se-del">${ICON.trash}Remove</button><button class="btn red" id="se-save">Save</button>`);
  $("#se-save", sh.foot).onclick = save;
  $("#se-del", sh.foot).onclick = async () => {
    if (!(await confirmBox({ title: `Remove ${ex.name}?`, body: `It comes out of ${rt.name}. Its history stays.`, ok: "Remove", danger: true }))) return;
    const i = rt.slots.indexOf(slot), removed = rt.slots.splice(i, 1)[0];
    savePlan(); sh.close(true); if (onDone) onDone();
    toast(`${ex.name} removed from ${rt.name}`, { label: "Undo", run: () => { rt.slots.splice(i, 0, removed); savePlan(); if (onDone) onDone(); render(); } });
  };
  draw();
}

// ---------- Picking and creating exercises ----------
function pickExercise(o, cb) {
  const sh = openSheet({ title: o.title || "Pick an exercise", tall: true, focus: true });
  sh.body.innerHTML = `<label class="search">${ICON.search}<input id="px-q" type="search" placeholder="Search or type a new name" autocomplete="off" enterkeyhint="go" aria-label="Search exercises"></label><div id="px-list" class="choices"></div>`;
  const q = $("#px-q", sh.body);
  function draw() {
    const v = q.value.trim(), k = v.toLowerCase();
    const kind = E.EX_KINDS.includes(o.kind) ? o.kind : "workout";
    const exact = v ? E.findExercise(S.plan.exercises, v, kind) : null;
    let list = S.plan.exercises.filter((e) => e.kind === kind && e.id !== o.exclude && (!k || e.name.toLowerCase().includes(k)));
    const fit = (e) => (o.kind === "stretch" ? e.type === "timed" : true);
    list = list.sort((a, b) => (fit(b) - fit(a)) || a.name.localeCompare(b.name));
    $("#px-list", sh.body).innerHTML = (v && !exact ? `<button class="choice" data-new>${ICON.plus}<span class="choice-main"><strong>Create “${esc(v)}”</strong><span>New exercise</span></span></button>` : "") +
      list.map((e) => `<button class="choice" data-id="${esc(e.id)}"><span class="choice-main"><strong>${esc(e.name)}</strong><span>${esc(exTypeLabel(e))}${e.side ? ", each side" : ""}</span></span></button>`).join("") +
      (!list.length && !v ? `<p class="empty">No ${esc(EX_KIND_HEAD[kind].toLowerCase())} yet. Type a name to create one.</p>` : "");
    $$("[data-id]", sh.body).forEach((b) => { b.onclick = () => { sh.close(true); cb(exById(b.dataset.id)); }; });
    const nb = $("[data-new]", sh.body); if (nb) nb.onclick = () => newExerciseForm(sh, v, o.kind, cb);
  }
  q.oninput = draw;
  q.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const first = $("#px-list .choice", sh.body); if (first) first.click();
  };
  draw();
  if (!matchMedia("(pointer: coarse)").matches) setTimeout(() => q.focus(), 60);
}
function newExerciseForm(sh, name, kind, cb) {
  sh.setTitle(kind === "stretch" ? "New stretch" : kind === "physio" ? "New physio exercise" : "New exercise");
  sh.body.innerHTML = field("Name", `<input id="nx-name" maxlength="80" autocomplete="off" value="${esc(name)}">`) +
    `<div class="field"><span class="field-l">Kind</span>${chips("nk", KIND_CHOICES, kind === "stretch" ? "timed" : "free")}</div>
    <label class="check"><input type="checkbox" id="nx-side"><span>Each side</span></label><p class="form-err" id="nx-err" role="alert" hidden></p>`;
  wireChips(sh.body, "nk", () => {});
  sh.setFoot(`<button class="btn red block" id="nx-go">Create exercise</button>`);
  $("#nx-go", sh.foot).onclick = () => {
    const nm = $("#nx-name", sh.body).value.trim();
    if (!nm) { const e = $("#nx-err", sh.body); e.textContent = "Give it a name."; e.hidden = false; return; }
    const exKind = E.EX_KINDS.includes(kind) ? kind : "workout";
    let ex = E.findExercise(S.plan.exercises, nm, exKind);
    if (!ex) {
      const k = chipValue(sh.body, "nk") || "free";
      const type = k === "free" || k === "machine" ? "weights" : k;
      ex = { id: uid("ex"), name: nm.slice(0, 80), type, equip: type === "weights" ? k : null, side: $("#nx-side", sh.body).checked, kind: exKind };
      S.plan.exercises.push(ex); savePlan();
    }
    sh.close(true); cb(ex);
  };
}

// ---------- All exercises ----------
function openExercises() {
  const sh = openSheet({ title: "Exercises", tall: true, onClose: () => render() });
  function draw() {
    const used = (id) => S.plan.routines.filter((r) => r.slots.some((s) => s.exId === id)).map((r) => r.name);
    const list = S.plan.exercises.slice().sort((a, b) => a.name.localeCompare(b.name));
    const row = (e) => { const u = used(e.id); return `<button class="choice" data-id="${esc(e.id)}"><span class="choice-main"><strong>${esc(e.name)}</strong><span>${esc(exTypeLabel(e))}${e.side ? ", each side" : ""}${u.length ? `. In ${u.join(", ")}` : ""}</span></span>${ICON.right}</button>`; };
    sh.body.innerHTML = list.length ? E.EX_KINDS.filter((k) => list.some((e) => e.kind === k)).map((k) => `<h3 class="h3 sec">${EX_KIND_HEAD[k]}</h3><div class="choices">${list.filter((e) => e.kind === k).map(row).join("")}</div>`).join("") : `<p class="empty">No exercises yet. Add them to a workout from Plan.</p>`;
    $$("[data-id]", sh.body).forEach((b) => { b.onclick = () => exerciseForm(exById(b.dataset.id), draw); });
  }
  draw();
}
function exerciseForm(ex, onDone) {
  const sh = openSheet({ title: ex.name });
  const inUse = S.plan.routines.some((r) => r.slots.some((s) => s.exId === ex.id));
  const hasLogs = S.logs.some((l) => (l.items || []).some((it) => it.exId === ex.id));
  sh.body.innerHTML = field("Name", `<input id="xf-name" maxlength="80" autocomplete="off" value="${esc(ex.name)}">`) +
    `<div class="field"><span class="field-l">Kind</span>${chips("xk", KIND_CHOICES, kindOf(ex.type, ex.equip))}</div>
    <label class="check"><input type="checkbox" id="xf-side"${ex.side ? " checked" : ""}><span>Each side</span></label>
    <p class="muted small">In your ${esc(EX_KIND_HEAD[ex.kind].toLowerCase())}. It can only be added to ${ex.kind === "workout" ? "workouts" : ex.kind === "physio" ? "physio routines" : "stretch routines"}.</p>
    ${!inUse ? `<button class="btn ghost danger-text block" id="xf-del">${ICON.trash}Delete exercise</button>` : `<p class="muted small">To delete it, take it out of your routines first.</p>`}`;
  wireChips(sh.body, "xk", () => {});
  sh.setFoot(`<button class="btn red block" id="xf-save">Save</button>`);
  $("#xf-save", sh.foot).onclick = () => {
    const nm = $("#xf-name", sh.body).value.trim();
    if (!nm) return;
    const k = chipValue(sh.body, "xk") || kindOf(ex.type, ex.equip), type = k === "free" || k === "machine" ? "weights" : k;
    ex.name = nm.slice(0, 80); ex.type = type; ex.equip = type === "weights" ? k : null; ex.side = $("#xf-side", sh.body).checked;
    savePlan(); sh.close(true); onDone();
  };
  const del = $("#xf-del", sh.body);
  if (del) del.onclick = async () => {
    if (!(await confirmBox({ title: `Delete ${ex.name}?`, body: hasLogs ? "Its logged sessions stay in your history." : "It isn't in any routine.", ok: "Delete", danger: true }))) return;
    S.plan.exercises = S.plan.exercises.filter((e) => e.id !== ex.id);
    savePlan(); sh.close(true); onDone();
  };
}

/* Settings: default increments and progression, BJJ defaults, backups, restore and CSV. */
async function openSettings() {
  const sh = openSheet({ title: "Settings", tall: true, onClose: () => render() });
  const persisted = await DB.persisted();
  const st = S.settings;
  const whenKey = `${st.prog.when}-${st.prog.when === "weeks" || st.prog.when === "sessions" ? st.prog.every : 1}`;
  const storage = DB.mode === "memory" ? "This browser isn't saving anything (Private Browsing?). Open the app normally to keep your log."
    : persisted ? "Saved on this phone. The browser keeps it until you delete the app." : "Saved on this phone. Download a backup now and then, in case the browser clears its storage.";
  sh.body.innerHTML = `<h3 class="h3 sec">Weight increments</h3>
    <div class="grid2">${field("Free weights", `<span class="unit-in"><input id="st-free" inputmode="decimal" value="${esc(E.fmtNum(st.inc.free))}"><span>lb</span></span>`)}${field("Machines", `<span class="unit-in"><input id="st-machine" inputmode="decimal" value="${esc(E.fmtNum(st.inc.machine))}"${st.inc.machinePlate ? " disabled" : ""}><span>lb</span></span>`)}</div>
    <label class="check"><input type="checkbox" id="st-plate"${st.inc.machinePlate ? " checked" : ""}><span>On machines, say Next plate and let me enter the new weight</span></label>
    <p class="muted small">How much weight goes on each time, unless an exercise has its own setting. With Next plate, the app tells you when to go up and you type the weight you moved to.</p>
    <h3 class="h3 sec">New exercises</h3>
    ${field("Go up", `<select id="st-when">${E.WHEN_OPTIONS.map(([k, l]) => `<option value="${k}"${k === whenKey ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`)}
    <label class="check"><input type="checkbox" id="st-hold"${st.prog.hold ? " checked" : ""}><span>Hold the weight if I miss reps</span></label>
    <p class="muted small">Exercises you already have keep their own setting. Physio exercises start at Only when I say.</p>
    <h3 class="h3 sec">BJJ</h3>
    ${field("Usual class length", `<span class="unit-in"><input id="st-bjj" inputmode="numeric" pattern="[0-9]*" value="${esc(st.bjj.minutes)}"><span>min</span></span>`)}
    <div class="field"><span class="field-l">Usual class</span>${chips("bk", E.BJJ_KINDS, st.bjj.kind)}</div>
    <h3 class="h3 sec">Your data</h3>
    <p class="small">${esc(storage)}</p>
    <button class="btn ghost block" id="st-json">${ICON.download}Download a full backup</button>
    <label class="btn ghost block file">${ICON.upload}Restore from a backup<input type="file" id="st-restore" accept="application/json,.json"></label>
    <div id="st-restore-box" aria-live="polite"></div>
    <button class="btn ghost block" id="st-csv">${ICON.download}Export to a spreadsheet (CSV)</button>
    <p class="muted small" id="st-last">${S.meta.lastBackup ? `Last backup ${esc(fmtStamp(S.meta.lastBackup))}.` : "No backup yet."} ${plural(S.logs.length, "session")} logged.</p>`;
  const B = sh.body;
  const posNum = (id, max) => { const n = E.num($(id, B).value); return n !== null && n > 0 && n <= max ? n : null; };
  $("#st-free", B).onchange = () => { const n = posNum("#st-free", 500); if (n) { st.inc.free = n; saveSettings(); } else $("#st-free", B).value = E.fmtNum(st.inc.free); };
  $("#st-machine", B).onchange = () => { const n = posNum("#st-machine", 500); if (n) { st.inc.machine = n; saveSettings(); } else $("#st-machine", B).value = E.fmtNum(st.inc.machine); };
  $("#st-plate", B).onchange = (e) => { st.inc.machinePlate = e.target.checked; $("#st-machine", B).disabled = e.target.checked; saveSettings(); };
  $("#st-when", B).onchange = (e) => { const [k, n] = e.target.value.split("-"); st.prog.when = k; st.prog.every = Number(n) || 1; saveSettings(); };
  $("#st-hold", B).onchange = (e) => { st.prog.hold = e.target.checked; saveSettings(); };
  $("#st-bjj", B).onchange = () => { const n = posNum("#st-bjj", 600); if (n) { st.bjj.minutes = Math.round(n); saveSettings(); } else $("#st-bjj", B).value = st.bjj.minutes; };
  wireChips(B, "bk", (v) => { if (v) { st.bjj.kind = v; saveSettings(); } });

  $("#st-json", B).onclick = async () => {
    const data = { app: "workout-tracker", version: 1, exported_at: nowISO(), plan: S.plan, settings: S.settings, logs: S.logs };
    const r = await DB.saveFile(`workout-tracker-backup-${S.today}.json`, JSON.stringify(data, null, 1), "application/json");
    if (r === "cancelled") return;
    S.meta = Object.assign({}, S.meta, { lastBackup: nowISO() }); saveMeta();
    $("#st-last", B).textContent = `Last backup ${fmtStamp(S.meta.lastBackup)}. ${plural(S.logs.length, "session")} logged.`;
    toast("Backup saved");
  };
  $("#st-csv", B).onclick = async () => {
    if (!S.logs.length) return toast("Nothing logged yet.");
    await DB.saveFile(`workout-tracker-${S.today}.csv`, E.toCSV(S.logs), "text/csv");
  };
  const box = $("#st-restore-box", B);
  $("#st-restore", B).onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    let d = null;
    try { d = JSON.parse(await f.text()); } catch (err) { d = null; }
    if (!d || d.app !== "workout-tracker" || !Array.isArray(d.logs)) { box.innerHTML = `<p class="form-err">That file isn't a Workout Tracker backup.</p>`; return; }
    const logs = d.logs.filter(E.validLog), have = new Set(S.logs.map((l) => l.id)), fresh = logs.filter((l) => !have.has(l.id));
    const plan = normPlan(d.plan);
    const dates = logs.map((l) => l.date).sort();
    box.innerHTML = `<div class="restore"><p>This backup has ${plural(logs.length, "session")}${dates.length ? ` from ${esc(E.fmtMD(dates[0]))}, ${dates[0].slice(0, 4)} to ${esc(E.fmtMD(dates[dates.length - 1]))}, ${dates[dates.length - 1].slice(0, 4)}` : ""} and ${plural(plan.routines.length, "routine")}. Restoring adds the ${plural(fresh.length, "session")} this phone doesn't have, and replaces your routines, split and settings with the backup's.</p><div class="row-btns"><button class="btn ghost sm" data-x="no">Cancel</button><button class="btn red sm" data-x="yes">Restore</button></div></div>`;
    $("[data-x=no]", box).onclick = () => { box.innerHTML = ""; };
    $("[data-x=yes]", box).onclick = async () => {
      try { if (fresh.length) await DB.putLogs(fresh); } catch (err) { return saveErr(err); }
      S.plan = plan; S.settings = normSettings(d.settings);
      await savePlan(); await saveSettings();
      loadLogs();
      sh.close(true);
      toast(`Restored. Added ${plural(fresh.length, "session")}.`);
    };
  };
}

/* Start */
boot().catch((e) => {
  const v = $("#view");
  if (v) v.innerHTML = `<div class="loading"><strong>The app couldn't open its storage.</strong><span>Close it and open it again. If that doesn't help, turn off Private Browsing.</span></div>`;
  if (window.console) console.error(e);
});

})();

</script>

if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
