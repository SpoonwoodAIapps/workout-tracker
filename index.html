<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="description" content="Personal workout log with progressive overload, a split, BJJ, physio and stretching. Your log stays on this device.">
<meta name="theme-color" content="#EEF0ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Workout Tracker: bumper-plate colours on gym-floor rubber. Barlow for text, Barlow Condensed for names and numbers. */
:root {
  --bg: #EEF0ED; --surface: #FFFFFF; --sunk: #E3E6E2; --ink: #15181B; --muted: #5C636A; --line: #D3D8D4; --line-2: #BFC5C0;
  --slab: #1C2125; --slab-ink: #F1F2EE; --slab-muted: #A9B1B6; --slab-line: #343B41;
  --red: #C8102E; --red-ink: #FFFFFF; --red-soft: #FBE8EA; --red-text: #B00E28;
  --p-workout: #C8102E; --p-freestyle: #E9B000; --p-bjj: #1E5AA8; --p-physio: #1F7A47; --p-stretch: #F4F4F1; --p-other: #5B636A;
  --ok: #1F7A47; --scrim: rgba(12, 15, 17, 0.5);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "Barlow Condensed", "Barlow", system-ui, sans-serif;
  --r-slab: 18px; --r-card: 12px; --r-in: 8px;
  --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1214; --surface: #171B1E; --sunk: #1F2427; --ink: #E7E9E5; --muted: #98A1A7; --line: #2A3135; --line-2: #3A4247;
    --slab: #22292E; --slab-ink: #F1F2EE; --slab-muted: #A3ACB2; --slab-line: #3A434A;
    --red: #DA2440; --red-soft: #3A1A20; --red-text: #FF7F8F;
    --p-workout: #DA2440; --p-stretch: #E9EAE6; --p-other: #6B747B;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.hero :focus-visible, .ses-head :focus-visible { outline-color: #FFB3BE; }

/* ---------- Frame ---------- */
.app { max-width: 640px; margin: 0 auto; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 0 4px; }
.wordmark { margin: 0; font: 700 21px/1 var(--cond); letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.wordmark .mark { width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: inset 0 0 0 6px var(--red), inset 0 0 0 8px rgba(0,0,0,.28); position: relative; }
.wordmark .mark::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); }
.spacer { flex: 1; }
.view { padding: 4px 0 calc(var(--tab-h) + 40px + env(safe-area-inset-bottom)); }
.loading { display: grid; justify-items: center; gap: 10px; padding: 80px 16px; color: var(--muted); text-align: center; }
.loading strong { color: var(--ink); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--red); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Tab bar (center button is a red bumper plate) ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; max-width: 640px; margin: 0 auto;
  padding: 6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
@media (min-width: 660px) { .tabbar { border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; min-height: 52px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 10px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .i { stroke: var(--red); stroke-width: 2.2; }
.tab-add-slot { display: grid; justify-items: center; }
.tab-add { width: 60px; height: 60px; margin-top: -22px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff; background: radial-gradient(circle, var(--red) 0 21px, rgba(0, 0, 0, 0.22) 21px 23px, var(--red) 23px); box-shadow: 0 4px 14px rgba(200, 16, 46, 0.35), inset 0 0 0 2px rgba(0, 0, 0, 0.18); }
.tab-add .i { width: 26px; height: 26px; stroke-width: 2.6; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.tab-add:active { transform: scale(0.96); }
html.in-session .tabbar { display: none; }

/* ---------- Type & blocks ---------- */
.dateline { margin: 6px 0 12px; color: var(--muted); font-weight: 500; }
.page-h { margin: 8px 0 14px; font: 700 34px/1 var(--cond); letter-spacing: -0.005em; }
.page-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.h2 { margin: 0; font: 700 20px/1.15 var(--cond); letter-spacing: 0.005em; }
.h3 { margin: 0; font: 700 17px/1.2 var(--cond); }
.h3.sec { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.sect { margin-top: 26px; display: grid; gap: 10px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; margin: 0; }
.empty { margin: 0; color: var(--muted); padding: 14px 16px; border: 1px dashed var(--line-2); border-radius: var(--r-card); }
.lead { margin: 0; font-size: 17px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 16px; text-decoration: none; white-space: nowrap; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.red { background: var(--red); color: var(--red-ink); }
.btn.red:active { filter: brightness(0.92); }
.btn.ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn.danger { background: var(--ink); color: var(--bg); }
.btn.danger-text { color: var(--red-text); }
.btn.on-slab { background: transparent; border-color: var(--slab-line); color: var(--slab-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: inherit; flex: none; }
.icon-btn.sm { width: 38px; height: 38px; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.icon-btn:not(:disabled):active { background: var(--sunk); }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 8px 0; color: var(--red-text); font-weight: 700; font-size: 15px; }
.link .i { width: 18px; height: 18px; }

/* ---------- Plate badges ---------- */
.pb { width: 26px; height: 26px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font: 700 13px/1 var(--cond); color: #fff; background: var(--p-other); box-shadow: inset 0 0 0 2px rgba(0,0,0,.14); }
.pb-workout { background: var(--p-workout); }
.pb-freestyle { background: var(--p-freestyle); color: #15181B; }
.pb-bjj { background: var(--p-bjj); }
.pb-physio { background: var(--p-physio); }
.pb-stretch { background: var(--p-stretch); color: #15181B; box-shadow: inset 0 0 0 1.5px #9AA19C; }
.pb-other { background: var(--p-other); }
.pb-more { font: 700 11px/1 var(--cond); color: var(--muted); align-self: center; }

/* ---------- Up next (the slab) ---------- */
.hero { background: var(--slab); color: var(--slab-ink); border-radius: var(--r-slab); padding: 18px 18px 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--red); }
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.hero-k { margin: 0; color: var(--slab-muted); font-weight: 600; font-size: 15px; }
.hero-link { border: 0; background: none; color: var(--slab-ink); font-weight: 600; font-size: 15px; padding: 8px 2px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--slab-line); }
.hero-name { margin: 0; font: 700 clamp(44px, 13vw, 64px)/0.92 var(--cond); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.hero-top + .hero-name { margin-top: -4px; }
.hero-name.long { font-size: clamp(32px, 9vw, 44px); line-height: 1; padding-top: 6px; }
.hero-sub { margin: 0; color: var(--slab-muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.hero-actions .btn { flex: 1 1 auto; }
.splitstrip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--slab-muted); font-weight: 600; font-size: 14px; }
.splitstrip li { display: inline-flex; align-items: center; gap: 6px; }
.splitstrip i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--slab-line); }
.splitstrip .done i { background: var(--slab-muted); border-color: var(--slab-muted); }
.splitstrip .next { color: var(--slab-ink); }
.splitstrip .next i { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 3px rgba(218, 36, 64, 0.25); }
.hero-list { list-style: none; margin: 2px 0 0; padding: 0; display: grid; }
.hero-list li { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name val" "pres val"; column-gap: 12px; padding: 9px 0; border-top: 1px solid var(--slab-line); }
.hl-name { grid-area: name; font-weight: 600; }
.hl-pres { grid-area: pres; color: var(--slab-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.hl-val { grid-area: val; align-self: center; display: flex; align-items: center; gap: 8px; font: 700 26px/1 var(--cond); font-variant-numeric: tabular-nums; }
.hl-val small { font: 600 14px/1 var(--font); color: var(--slab-muted); margin-left: 2px; }
.hl-blank { font: 500 14px/1 var(--font); color: var(--slab-muted); }
.hl-more { color: var(--slab-muted); font-size: 14px; display: block !important; }
.tag { display: inline-flex; align-items: center; padding: 3px 7px; border-radius: 6px; font: 700 13px/1 var(--cond); letter-spacing: 0.01em; white-space: nowrap; vertical-align: 1px; }
.tag.up { background: var(--red); color: #fff; }
.tag.held { background: var(--sunk); color: var(--muted); }
.hero .tag.held { background: var(--slab-line); color: var(--slab-ink); }
.tag.next { background: var(--red-soft); color: var(--red-text); }

/* ---------- Quick log & week ---------- */
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.qbtn { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); font-weight: 600; font-size: 15px; text-align: left; line-height: 1.15; }
.qbtn:active { background: var(--sunk); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: grid; justify-items: center; align-content: start; gap: 2px; min-height: 84px; padding: 8px 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.wd-n { font-size: 12px; color: var(--muted); font-weight: 600; }
.wd-d { font: 700 20px/1.1 var(--cond); }
.wd-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 2px; }
.wd-dots .pb, .cd-dots .pb { width: 15px; height: 15px; font-size: 9px; box-shadow: none; }
.wd-dots .pb-stretch, .cd-dots .pb-stretch { box-shadow: inset 0 0 0 1px #9AA19C; }
.wd.is-today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.wd.is-future { background: transparent; border-style: dashed; }
.week-sum { margin: 0; color: var(--muted); font-size: 15px; }

/* ---------- Lists ---------- */
.loglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lrow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; min-height: 60px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); text-align: left; }
.lrow:active { background: var(--sunk); }
.lrow > .i { color: var(--muted); }
.lr-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.lr-main strong { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-main span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-side { color: var(--muted); font-size: 14px; white-space: nowrap; }
.pr-delta { font: 700 17px/1 var(--cond); color: var(--red-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pr-delta.down { color: var(--muted); }

/* ---------- Sheets ---------- */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.18s ease-out; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 28px - env(safe-area-inset-top)); display: flex; flex-direction: column; background: var(--bg); border-radius: 18px 18px 0 0; animation: slide 0.22s cubic-bezier(.2,.8,.2,1); }
.sheet-wrap.tall .sheet { height: calc(100% - 28px - env(safe-area-inset-top)); }
.sheet-head { display: flex; align-items: center; gap: 6px; padding: 10px max(10px, env(safe-area-inset-right)) 8px max(18px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; flex: 1; min-width: 0; font: 700 22px/1.15 var(--cond); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head [data-back] { margin-left: -10px; }
.sheet-body > .h3.sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; align-content: start; }
.sheet-foot { display: flex; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: var(--bg); }
.sheet-foot .btn { flex: 1; }
@media (min-width: 700px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 18px; max-height: min(820px, calc(100% - 48px)); }
  .sheet-wrap.tall .sheet { height: min(820px, calc(100% - 48px)); }
  .sheet-foot { border-radius: 0 0 18px 18px; padding-bottom: 12px; }
}
@keyframes slide { from { transform: translateY(32px); } to { transform: none; } }
@keyframes rise { from { transform: translate(-50%, 12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- Forms ---------- */
.field { display: grid; gap: 6px; margin: 0; min-width: 0; }
.field-l { font-weight: 600; font-size: 15px; }
.field-h { color: var(--muted); font-size: 13px; }
:where(input:not([type=checkbox]):not([type=file]), select, textarea) { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-in); background: var(--surface); font-size: 17px; }
textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
select { appearance: none; -webkit-appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 21px, calc(100% - 13px) 21px; background-size: 6px 6px; background-repeat: no-repeat; }
input[type=date] { min-width: 0; -webkit-appearance: none; appearance: none; display: block; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
.unit-in, .range-in { display: flex; align-items: center; gap: 8px; }
.unit-in > span, .range-in > span { color: var(--muted); font-weight: 600; flex: none; }
.unit-in input { max-width: 140px; }
.range-in input { max-width: 92px; text-align: center; }
.unit-in.sm input, .range-in.sm input { max-width: 64px; min-height: 42px; padding: 6px 8px; text-align: center; font-size: 16px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper input { width: 64px; text-align: center; font: 700 20px/1 var(--cond); }
.stepper .icon-btn { border: 1px solid var(--line-2); background: var(--surface); width: 44px; height: 48px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.amounts { display: grid; gap: 14px; align-items: start; }
@media (min-width: 480px) { .amounts { grid-template-columns: auto 1fr; } }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--red); flex: none; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 15px; }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chips.fill .chip { min-height: 36px; font-size: 14px; }
.form-err { margin: 0; color: var(--red-text); font-weight: 600; }
.ok { margin: 0; color: var(--ok); font-weight: 600; }
.search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 48px; border: 1px solid var(--line-2); border-radius: var(--r-in); background: var(--surface); }
.search .i { color: var(--muted); }
.search input { border: 0; padding: 0; min-height: 44px; background: transparent; outline: none; }
.search:focus-within { outline: 3px solid var(--red); outline-offset: 2px; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.restore { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: var(--r-card); background: var(--surface); }
.restore p { margin: 0; }

/* ---------- Choices ---------- */
.choices { display: grid; gap: 6px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 12px 10px 14px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); text-align: left; }
.choice:active { background: var(--sunk); }
.choice > .i:last-child { color: var(--muted); }
.choice > .i:first-child { color: var(--red-text); }
.choice-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.choice-main strong { font-weight: 700; }
.choice-main span { color: var(--muted); font-size: 14px; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)); z-index: 60; width: max-content; max-width: calc(100% - 24px); display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; background: var(--ink); color: var(--bg); border-radius: 12px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: rise 0.2s ease-out; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
html.in-session .toast { bottom: calc(20px + env(safe-area-inset-bottom)); }

/* ---------- Session ---------- */
.session { position: fixed; inset: 0; z-index: 40; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--bg); }
html.in-session, html.in-session body { overflow: hidden; }

<script>
/* Storage on this device: IndexedDB (falls back to localStorage, then memory).
   Kept apart from the Spend Tracker on the same site by its own database, channel and key prefix. */
(function () {
  "use strict";
  const DB_NAME = "workout-tracker", LS = "wt:";
  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  let idb = null, mode = "memory";
  const memKV = new Map(), memLogs = new Map();
  const listeners = new Set();

  function openIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "k" });
        if (!db.objectStoreNames.contains("logs")) db.createObjectStore("logs", { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("blocked"));
    });
  }
  function getAll(store) {
    return new Promise((resolve, reject) => {
      const q = idb.transaction(store, "readonly").objectStore(store).getAll();
      q.onsuccess = () => resolve(q.result || []);
      q.onerror = () => reject(q.error);
    });
  }
  function tx(store, fn) {
    return new Promise((resolve, reject) => {
      const t = idb.transaction(store, "readwrite");
      fn(t.objectStore(store));
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error("aborted"));
    }).catch((e) => { throw { code: e && e.name === "QuotaExceededError" ? "quota" : "unavailable", message: String(e && e.message || e) }; });
  }

  const ready = (async () => {
    try {
      if (!window.indexedDB) throw new Error("no indexedDB");
      idb = await openIdb();
      for (const row of await getAll("kv")) memKV.set(row.k, row.v);
      for (const log of await getAll("logs")) memLogs.set(log.id, log);
      mode = "idb";
    } catch (e) {
      idb = null;
      try {
        localStorage.setItem(LS + "probe", "1"); localStorage.removeItem(LS + "probe");
        mode = "ls";
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(LS)) continue;
          try {
            if (k.startsWith(LS + "kv:")) memKV.set(k.slice(LS.length + 3), JSON.parse(localStorage.getItem(k)));
            else if (k.startsWith(LS + "log:")) { const l = JSON.parse(localStorage.getItem(k)); if (l && l.id) memLogs.set(l.id, l); }
          } catch (e2) { /* skip a damaged entry */ }
        }
      } catch (e3) { mode = "memory"; }
    }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* optional */ }
  })();

  const bc = typeof BroadcastChannel === "function" ? new BroadcastChannel("workout-tracker") : null;
  function tell(msg) { if (bc) try { bc.postMessage(msg); } catch (e) { /* ignore */ } }
  if (bc) bc.onmessage = (ev) => {
    const m = ev.data || {};
    if (m.kind === "kv") { if (m.value === undefined) memKV.delete(m.key); else memKV.set(m.key, m.value); }
    else if (m.kind === "log") { if (m.value) memLogs.set(m.key, m.value); else memLogs.delete(m.key); }
    else if (m.kind === "logs") { for (const l of m.value || []) memLogs.set(l.id, l); }
    else return;
    for (const fn of Array.from(listeners)) { try { fn(m); } catch (e) { /* listener error */ } }
  };

  async function setKV(key, value) {
    await ready;
    const v = clone(value);
    if (mode === "idb") await tx("kv", (s) => (v === undefined ? s.delete(key) : s.put({ k: key, v })));
    else if (mode === "ls") {
      try { if (v === undefined) localStorage.removeItem(LS + "kv:" + key); else localStorage.setItem(LS + "kv:" + key, JSON.stringify(v)); }
      catch (e) { throw { code: "quota", message: String(e) }; }
    }
    if (v === undefined) memKV.delete(key); else memKV.set(key, v);
    tell({ kind: "kv", key, value: v });
  }
  async function putLogs(logs) {
    await ready;
    const list = clone(logs);
    if (mode === "idb") await tx("logs", (s) => { for (const l of list) s.put(l); });
    else if (mode === "ls") {
      try { for (const l of list) localStorage.setItem(LS + "log:" + l.id, JSON.stringify(l)); }
      catch (e) { throw { code: "quota", message: String(e) }; }
    }
    for (const l of list) memLogs.set(l.id, l);
    tell(list.length === 1 ? { kind: "log", key: list[0].id, value: list[0] } : { kind: "logs", value: list });
  }
  async function delLog(id) {
    await ready;
    if (mode === "idb") await tx("logs", (s) => s.delete(id));
    else if (mode === "ls") localStorage.removeItem(LS + "log:" + id);
    memLogs.delete(id);
    tell({ kind: "log", key: id, value: null });
  }

  // Files: the share sheet on phones (Save to Files, AirDrop, email), a normal download elsewhere.
  async function saveFile(name, text, type) {
    const blob = new Blob([text], { type });
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (mobile && typeof File === "function" && navigator.canShare) {
      const file = new File([blob], name, { type });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return "shared"; }
        catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return "downloaded";
  }

  window.Store = {
    ready,
    get mode() { return mode; },
    get: (key) => clone(memKV.get(key)),
    logs: () => Array.from(memLogs.values()).map(clone),
    setKV, putLog: (l) => putLogs([l]), putLogs, delLog,
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    async persisted() { try { return !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch (e) { return false; } },
    saveFile
  };
})();

</script>

/* Workout Tracker engine: pure, deterministic functions.
   Every target, the next workout in the split and every summary are worked out from the logs. */
(function (root) {
  "use strict";

  // ---------- Constants ----------
  const TYPES = ["workout", "freestyle", "bjj", "physio", "stretch", "other"];
  const TYPE_LABEL = { workout: "Workout", freestyle: "Freestyle", bjj: "BJJ", physio: "Physio", stretch: "Stretch", other: "Other" };
  const TYPE_LETTER = { workout: "W", freestyle: "F", bjj: "B", physio: "P", stretch: "S", other: "O" };
  const ROUTINE_KINDS = ["workout", "physio", "stretch"];

  const WHEN_OPTIONS = [

    ["sessions-2", "Every 2 workouts"], ["sessions-3", "Every 3 workouts"], ["sessions-4", "Every 4 workouts"],
    ["range-1", "When I hit the top of my reps"], ["manual-1", "Only when I say"]
  ];
  const BJJ_KINDS = ["Gi", "No-gi", "Open mat", "Drilling", "Private", "Competition"];
  const DEFAULT_SETTINGS = { inc: { free: 5, machine: 10, machinePlate: true }, prog: { when: "weeks", every: 1, hold: true }, bjj: { minutes: 60, kind: "Gi" } };
  const EX_KINDS = ["workout", "physio", "stretch"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const DOW_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  // ---------- Dates (YYYY-MM-DD, calendar days) ----------
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  function toUTC(s) { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }
  function fromUTC(t) { const d = new Date(t); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && fromUTC(toUTC(s)) === s;
  const addDays = (s, n) => fromUTC(toUTC(s) + n * 86400000);
  const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);
  const dayIndex = (s) => (new Date(toUTC(s)).getUTCDay() + 6) % 7; // Monday = 0
  const weekStart = (s) => addDays(s, -dayIndex(s));
  const weeksBetween = (a, b) => Math.round(diffDays(weekStart(a), weekStart(b)) / 7);
  const monthKey = (s) => s.slice(0, 7);
  function daysInMonth(mk) { const [y, m] = mk.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

    wrap, body: $(".sheet-body", wrap), foot: $(".sheet-foot", wrap),
    close(skipHook) {
      if (!skipHook && o.beforeClose && o.beforeClose() === false) return;
      wrap.remove();
      const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
      if (!sheets.length) document.documentElement.classList.remove("sheet-open");
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
      if (o.onClose) o.onClose();
    },
    setTitle(t) { $(".sheet-head h2", wrap).textContent = t; },
    setFoot(html) { api.foot.hidden = !html; api.foot.innerHTML = html || ""; }
  };
  $$("[data-close]", wrap).forEach((b) => { b.onclick = () => api.close(); });
  const bk = $("[data-back]", wrap); if (bk) bk.onclick = () => o.back();
  sheets.push(api);
  setTimeout(() => { if (!o.focus) { const f = $(".sheet-head .icon-btn", wrap); if (f) f.focus({ preventScroll: true }); } }, 0);
  return api;
}
function closeAllSheets() { while (sheets.length) sheets[sheets.length - 1].close(true); }
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (sheets.length) { e.preventDefault(); sheets[sheets.length - 1].close(); }
});
function confirmBox(o) {
  return new Promise((resolve) => {
    let answered = false;
    const sh = openSheet({ title: o.title, onClose: () => { if (!answered) resolve(false); } });
    sh.body.innerHTML = `<p class="lead">${esc(o.body)}</p>`;
    sh.setFoot(`<button class="btn ghost" data-x="no">${esc(o.cancel || "Cancel")}</button><button class="btn ${o.danger ? "danger" : "red"}" data-x="yes">${esc(o.ok)}</button>`);
    $("[data-x=no]", sh.foot).onclick = () => sh.close();
    $("[data-x=yes]", sh.foot).onclick = () => { answered = true; sh.close(); resolve(true); };
  });
}
// A short list of choices: [[key, label, sub], ...]
function choiceSheet(title, options, cb) {
  const sh = openSheet({ title });
  sh.body.innerHTML = `<div class="choices">${options.map(([k, label, sub, type]) => `<button class="choice" data-k="${esc(k)}">${type ? badge(type) : ""}<span class="choice-main"><strong>${esc(label)}</strong>${sub ? `<span>${esc(sub)}</span>` : ""}</span>${ICON.right}</button>`).join("")}</div>`;
  $$("[data-k]", sh.body).forEach((b) => { b.onclick = () => { sh.close(true); cb(b.dataset.k); }; });
  return sh;
}

// ---------- Toast ----------
let toastTimer = null;
function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
  t.hidden = false;
  if (action) $("button", t).onclick = () => { t.hidden = true; action.run(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, action ? 8000 : 3500);
}

// ---------- Shared bits ----------
function logSub(l) {
  const parts = [];
  if (l.type === "freestyle") { if (l.for) parts.push(`For ${l.for}`); }
  else if (l.type === "bjj") { if (l.bjj && l.bjj.kind) parts.push(l.bjj.kind); if (l.bjj && l.bjj.rounds) parts.push(plural(l.bjj.rounds, "round")); }
  else if (Array.isArray(l.items) && l.items.length) {
    const done = l.items.filter(E.performed).length, sk = l.items.length - done;
    parts.push(l.type === "stretch" ? `${done} of ${plural(l.items.length, "stretch", "stretches")}` : kindNoun(l.type, done));
    if (sk && l.type !== "stretch") parts.push(`${sk} skipped`);
  }
  if (l.minutes) parts.push(E.fmtMinutes(l.minutes));
  return parts.join(", ");
}
function logTitle(l) { return l.type === "bjj" ? "BJJ" : l.type === "freestyle" ? "Freestyle" : (l.title || E.TYPE_LABEL[l.type]); }
function logRow(l, opt) {
  const o = opt || {};
  return `<li><button class="lrow" data-act="open-log" data-id="${esc(l.id)}">${badge(l.type)}<span class="lr-main"><strong>${esc(logTitle(l))}</strong><span>${esc(logSub(l))}</span></span>${o.date ? `<span class="lr-side">${esc(dayWord(l.date))}</span>` : ""}</button></li>`;
}
ACT["open-log"] = (el) => openLogDetail(el.dataset.id);
ACT.day = (el) => openDay(el.dataset.date);
function field(label, inner, hint) { return `<label class="field"><span class="field-l">${esc(label)}</span>${inner}${hint ? `<span class="field-h">${esc(hint)}</span>` : ""}</label>`; }
function chips(name, options, value) {
  return `<div class="chips" role="radiogroup">${options.map((o) => { const [k, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" class="chip" role="radio" data-chip="${esc(name)}" data-v="${esc(k)}" aria-checked="${k === value}">${esc(l)}</button>`; }).join("")}</div>`;
}
function wireChips(root, name, onPick) {
  $$(`[data-chip="${name}"]`, root).forEach((b) => {
    b.onclick = () => {
      const on = b.getAttribute("aria-checked") === "true";
      $$(`[data-chip="${name}"]`, root).forEach((x) => x.setAttribute("aria-checked", "false"));
      if (!on || !onPick.toggle) b.setAttribute("aria-checked", "true");
      onPick(on && onPick.toggle ? "" : b.dataset.v);
    };
  });
}
const chipValue = (root, name) => { const b = $(`[data-chip="${name}"][aria-checked="true"]`, root); return b ? b.dataset.v : ""; };

// ---------- Boot ----------
async function boot() {
  renderChrome(); render();
  await DB.ready;
  let plan = DB.get("plan");
  if (!plan) {
    const seed = E.seedState();
    plan = { exercises: seed.exercises, routines: seed.routines, split: [], splitOverride: null };
    S.plan = normPlan(plan); S.settings = normSettings(seed.settings);
    await DB.setKV("plan", S.plan).catch(() => {});
    await DB.setKV("settings", S.settings).catch(() => {});
  } else { S.plan = normPlan(plan); S.settings = normSettings(DB.get("settings")); }
  S.draft = normDraft(DB.get("draft"));
  S.meta = DB.get("meta") || {};
  loadLogs();
  S.booted = true;
  render();
  DB.onChange((m) => {
    if (m.kind === "kv") {
      if (m.key === "plan") S.plan = normPlan(m.value);
      else if (m.key === "settings") S.settings = normSettings(m.value);
      else if (m.key === "meta") S.meta = m.value || {};
      else if (m.key === "draft" && !S.sessionOpen) S.draft = normDraft(m.value);
    } else loadLogs();
    if (!S.sessionOpen && !sheets.length) scheduleRender();
  });
  if (DB.mode === "memory") setTimeout(() => toast("This browser won't keep your log (Private Browsing?). Open the app normally to save it."), 800);
}

/* Today: the next workout in the split, quick logging, this week. Plus the log sheet and the simple activity forms. */
const TYPE_NOUN = { workout: ["workout", "workouts"], freestyle: ["freestyle session", "freestyle sessions"], bjj: ["BJJ session", "BJJ sessions"], physio: ["physio session", "physio sessions"], stretch: ["stretch session", "stretch sessions"], other: ["other activity", "other activities"] };
function typeCountText(c) {
  return E.TYPES.filter((t) => c[t]).map((t) => plural(c[t], TYPE_NOUN[t][0], TYPE_NOUN[t][1])).join(", ");
}
function dots(ls, max) {
  const m = max || 3;
  return ls.slice(0, m).map((l) => badge(l.type)).join("") + (ls.length > m ? `<span class="pb-more">+${ls.length - m}</span>` : "");
}
const FREESTYLE_FOR = ["Full body", "Upper body", "Lower body", "Arms", "Shoulders", "Core", "Conditioning", "Cardio"];

function viewToday() {
  const d = S.today;
  const todays = S.logs.filter((l) => l.date === d);

      </div>
    </section>

    <section class="sect"><h2 class="h2">Recently</h2>${recent.length ? `<ul class="loglist">${recent.map((l) => logRow(l, { date: true })).join("")}</ul>` : `<p class="empty">Your sessions show up here once you log them.</p>`}</section>`;
}

function heroCard() {
  const s = S.draft;
  if (s) {
    const n = s.items.length, done = s.items.filter((it) => E.performed(it) || it.status === "skipped").length;
    return `<section class="hero">
      <p class="hero-k">Unfinished</p>
      <h1 class="hero-name">${esc(s.title)}</h1>
      <p class="hero-sub">${esc(dayWord(s.date))}, started at ${esc(fmtClock(s.startedAt))}. ${done} of ${esc(kindNoun(s.type, n))} done.</p>
      <div class="hero-actions"><button class="btn red" data-act="resume">${ICON.play}Resume</button><button class="btn on-slab" data-act="discard-draft">Discard</button></div>
    </section>`;
  }
  if (!S.plan.split.length) {
    const has = routinesOf("workout").length > 0;
    return `<section class="hero">
      <h1 class="hero-name long">Set up your split</h1>
      <p class="hero-sub">Add the workouts you rotate through. This card then loads the next one with its weights, ready to start.</p>
      <div class="hero-actions">${has ? `<button class="btn red" data-act="tab" data-tab="plan">Add workouts to your split</button>` : `<button class="btn red" data-act="starter">Use a starter split</button><button class="btn on-slab" data-act="new-routine" data-kind="workout">Build my own</button>`}</div>
    </section>`;
  }
  const info = splitInfo(), rt = rtById(info.routineId);
  const strip = `<ol class="splitstrip" aria-label="Your split">${S.plan.split.map((x, i) => { const r = rtById(x.routineId); const st = i === info.next ? "next" : info.done[i] ? "done" : ""; return `<li class="${st}"${i === info.next ? ' aria-current="step"' : ""}><i aria-hidden="true"></i>${esc(r ? r.name : "")}${st === "done" ? '<span class="sr"> (done this round)</span>' : ""}</li>`; }).join("")}</ol>`;
  const rows = [];
  for (const slot of rt.slots) {
    const ex = exById(slot.exId); if (!ex) continue;
    const t = targetFor(slot, ex, S.today, { fallback: true });
    const val = ex.type === "weights" ? (t.load !== null ? `${E.fmtNum(t.load)}<small>lb</small>` : `<span class="hl-blank">Set weight</span>`) : "";
    const tag = t.change === "up" ? `<span class="tag up">${esc(t.delta)}</span>` : t.change === "held" ? `<span class="tag held">Held</span>` : "";
    rows.push(`<li><span class="hl-name">${esc(ex.name)}</span><span class="hl-pres">${esc(E.prescription(t, ex.side))}</span><span class="hl-val">${val}${tag}</span></li>`);
  }
  const more = rows.length > 8 ? `<li class="hl-more">${rows.length - 7} more</li>` : "";
  return `<section class="hero">
    <div class="hero-top"><p class="hero-k">Up next</p><button class="hero-link" data-act="change-next">Change</button></div>
    <h1 class="hero-name">${esc(rt.name)}</h1>
    ${S.plan.split.length > 1 ? strip : ""}
    ${rows.length ? `<ul class="hero-list">${(rows.length > 8 ? rows.slice(0, 7) : rows).join("")}${more}</ul>` : `<p class="hero-sub">No exercises in ${esc(rt.name)} yet.</p>`}
    <div class="hero-actions">${rows.length ? `<button class="btn red block" data-act="start" data-rt="${esc(rt.id)}">${ICON.play}Start ${esc(rt.name)}</button>` : `<button class="btn red block" data-act="edit-routine" data-rt="${esc(rt.id)}">Add exercises to ${esc(rt.name)}</button>`}</div>
  </section>`;
}

function weekStrip() {
  const ws = E.weekStart(S.today), we = E.addDays(ws, 6);
  const c = E.countByType(S.logs, ws, we);
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = E.addDays(ws, i), ls = S.logs.filter((l) => l.date === d);
    cells.push(`<button class="wd${d === S.today ? " is-today" : ""}${d > S.today ? " is-future" : ""}" data-act="day" data-date="${d}" aria-label="${esc(E.fmtDayLong(d))}: ${esc(ls.length ? ls.map(logTitle).join(", ") : "nothing logged")}"><span class="wd-n">${E.DOW[i]}</span><span class="wd-d">${+d.slice(8)}</span><span class="wd-dots">${dots(ls)}</span></button>`);
  }
  return `<section class="sect">
    <div class="block-head"><h2 class="h2">This week</h2><span class="muted">${esc(E.fmtRange(ws, we))}</span></div>
    <div class="week">${cells.join("")}</div>
    <p class="week-sum">${c.total ? esc(typeCountText(c)) : "Nothing logged yet this week."}</p>
  </section>`;
}

ACT.quick = (el) => logChoice(el.dataset.k, S.today);
ACT.resume = () => openSession();
ACT["discard-draft"] = async () => {

  }), (k) => {

// ---------- Log sheet ----------
function openLogSheet(date) {
  let d = E.isDate(date) && date <= S.today ? date : S.today;
  const sh = openSheet({ title: "Log an activity" });
  const nx = !S.draft ? nextRoutine() : null;
  const names = (kind) => routinesOf(kind).map((r) => r.name).join(", ");
  const opt = (k, type, label, sub) => `<button class="choice" data-k="${k}">${badge(type)}<span class="choice-main"><strong>${esc(label)}</strong>${sub ? `<span>${esc(sub)}</span>` : ""}</span>${ICON.right}</button>`;
  sh.body.innerHTML = `${field("Day", `<input type="date" id="lg-date" value="${d}" max="${S.today}" required>`)}
    <div class="choices">
      ${S.draft ? opt("resume", S.draft.type, `Resume ${S.draft.title}`, "Unfinished session") : ""}
      ${nx && nx.slots.length ? opt("next", "workout", nx.name, "Next in your split") : ""}
      ${opt("workout", "workout", nx ? "A different workout" : "A workout", routinesOf("workout").length ? "Pick one of your workouts" : "Set one up first")}
      ${opt("freestyle", "freestyle", "Freestyle", "No exercises, just what it was for")}
      ${opt("bjj", "bjj", "BJJ", "Class, open mat or drilling")}
      ${opt("physio", "physio", "Physio", names("physio"))}
      ${opt("stretch", "stretch", "Stretch", names("stretch"))}
      ${opt("other", "other", "Something else", "A run, a hike, a game")}
    </div>`;
  const inp = $("#lg-date", sh.body);
  inp.onchange = () => { if (E.isDate(inp.value) && inp.value <= S.today) d = inp.value; else inp.value = d; };
  $$(".choice", sh.body).forEach((b) => { b.onclick = () => { sh.close(true); logChoice(b.dataset.k, d); }; });
}

function logChoice(k, date) {
  if (k === "resume") return openSession();
  if (k === "next") { const r = nextRoutine(); return r ? startSession(r.id, date) : null; }
  if (k === "freestyle" || k === "bjj" || k === "other") return openActivityForm(k, { date });
  const kind = k === "workout" ? "workout" : k;
  const list = routinesOf(kind);
  if (!list.length) {
    toast(kind === "workout" ? "Set up a workout first." : `Set up your ${kind === "physio" ? "physio" : "stretch"} routine first.`);
    return newRoutine(kind);
  }
  if (list.length === 1 && kind !== "workout") return startSession(list[0].id, date);
  const nx = nextRoutine();
  choiceSheet(kind === "workout" ? "Which workout?" : kind === "physio" ? "Which physio routine?" : "Which stretch routine?", list.map((r) => [r.id, r.name, `${kindNoun(r.kind, r.slots.length)}${nx && nx.id === r.id ? ", next in your split" : ""}`, kind]), (id) => startSession(id, date));
}

// ---------- Freestyle, BJJ and other activities ----------
function openActivityForm(type, o) {
  const old = o.log || null;
  const titles = { freestyle: "Freestyle workout", bjj: "BJJ", other: "Something else" };
  const editTitles = { freestyle: "Edit freestyle", bjj: "Edit BJJ", other: "Edit activity" };
  const sh = openSheet({ title: old ? editTitles[type] : titles[type], focus: true });
  const date = old ? old.date : (o.date || S.today);
  const minutes = old ? (old.minutes || "") : (type === "bjj" ? S.settings.bjj.minutes : "");
  const minField = field("How long", `<span class="unit-in"><input id="af-min" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${esc(minutes)}" placeholder="${type === "bjj" ? "" : "Optional"}"><span>min</span></span>`);
  const notes = field("Notes", `<textarea id="af-notes" rows="3" maxlength="1000" placeholder="${type === "bjj" ? "What you worked on, how it went" : "Optional"}">${esc(old ? old.notes : "")}</textarea>`);
  let body = field("Day", `<input type="date" id="af-date" value="${date}" max="${S.today}" required>`);
  if (type === "freestyle") {
    const sugg = Array.from(new Set(routinesOf("workout").map((r) => r.name).concat(FREESTYLE_FOR)));
    body += field("What was it for?", `<input id="af-for" maxlength="80" autocomplete="off" placeholder="Legs, arms, conditioning…" value="${esc(old ? old.for : "")}">`) +
      `<div class="chips fill">${sugg.map((x) => `<button type="button" class="chip" data-fill="${esc(x)}">${esc(x)}</button>`).join("")}</div>` + minField + notes;
  } else if (type === "bjj") {
    const kind = old && old.bjj && old.bjj.kind ? old.bjj.kind : S.settings.bjj.kind;
    body += `<div class="field"><span class="field-l">Class</span>${chips("kind", E.BJJ_KINDS, kind)}</div>` + minField +
      field("Rounds rolled", `<input id="af-rounds" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="Optional" value="${esc(old && old.bjj && old.bjj.rounds || "")}">`) + notes;
  } else {
    body += field("What did you do?", `<input id="af-what" maxlength="80" autocomplete="off" placeholder="Run, hike, basketball…" value="${esc(old ? old.title : "")}">`) + minField + notes;
  }
  sh.body.innerHTML = body + `<p class="form-err" id="af-err" role="alert" hidden></p>`;
  sh.setFoot(`<button class="btn red block" id="af-save">${old ? "Save changes" : type === "freestyle" ? "Save freestyle" : type === "bjj" ? "Save BJJ" : "Save"}</button>`);
  if (type === "bjj") wireChips(sh.body, "kind", () => {});
  $$("[data-fill]", sh.body).forEach((b) => { b.onclick = () => { const i = $("#af-for", sh.body); i.value = b.dataset.fill; i.focus(); }; });
  setTimeout(() => { const f = $("#af-for, #af-what", sh.body) || $("#af-min", sh.body); if (f && !old) f.focus(); }, 60);
  const err = (m) => { const e = $("#af-err", sh.body); e.textContent = m; e.hidden = !m; };
  $("#af-save", sh.foot).onclick = async () => {
    const dv = $("#af-date", sh.body).value;
    if (!E.isDate(dv) || dv > S.today) return err("Pick a day up to today.");
    const mv = $("#af-min", sh.body).value.trim();
    const min = mv ? E.num(mv) : null;
    if (mv && (min === null || min < 1 || min > 1440 || Math.round(min) !== min)) return err("Enter the minutes as a whole number.");
    const log = { id: old ? old.id : uid("lg"), date: dv, type, title: "", minutes: min, notes: $("#af-notes", sh.body).value.trim(), created_at: old ? old.created_at : nowISO() };
    if (old) log.updated_at = nowISO();
    if (type === "freestyle") {
      const f = $("#af-for", sh.body).value.trim();
      if (!f) { $("#af-for", sh.body).focus(); return err("Add what it was for, like legs or arms."); }
      log.title = "Freestyle"; log.for = f;
    } else if (type === "bjj") {
      const kind = chipValue(sh.body, "kind") || S.settings.bjj.kind;
      const rv = $("#af-rounds", sh.body).value.trim(), rounds = rv ? E.num(rv) : null;
      if (rv && (rounds === null || rounds < 0 || rounds > 99 || Math.round(rounds) !== rounds)) return err("Enter the rounds as a whole number.");
      log.title = kind; log.bjj = { kind, rounds };
    } else {
      const w = $("#af-what", sh.body).value.trim();
      if (!w) { $("#af-what", sh.body).focus(); return err("Add what you did."); }
      log.title = w;
    }
    try { await putLog(log); } catch (e) { return saveErr(e); }
    sh.close(true); render();
    const name = type === "freestyle" ? "Freestyle" : type === "bjj" ? "BJJ" : log.title;
    if (old) toast("Changes saved");
    else toast(`${name} saved${dv !== S.today ? ` for ${E.fmtDay(dv)}` : ""}`, { label: "Undo", run: async () => { await removeLog(log.id).catch(saveErr); render(); } });
  };
}

/* A session: a routine loaded with its targets. Tick sets, change numbers, swap, skip, add, finish. */
const SKIP_REASONS = ["Pain or injury", "Too sore", "Short on time", "Equipment busy", "Felt off"];
let editDirty = false;

function makeItem(slot, ex, date, o) {
  const t = targetFor(slot, ex, date, o);
  return {
    key: uid("it"), slotId: slot.id, exId: ex.id, name: ex.name, exType: ex.type, equip: ex.equip, side: !!ex.side,
    status: "open", skipReason: "", skipNote: "", note: "", plan: slot.note || "", hint: t.hint || "",
    target: E.snapshot(t), sets: t.goal.map((g) => ({ load: g.load, reps: g.reps, secs: g.secs, done: false })), next: null
  };
}

async function startSession(routineId, date) {
  const rt = rtById(routineId);
  if (!rt) return;
  const d = date || S.today;
  if (S.draft) {
    if (S.draft.routineId === routineId && S.draft.date === d) return openSession();
    const ok = await confirmBox({ title: `Discard ${S.draft.title}?`, body: `You have an unfinished ${S.draft.title}. Starting ${rt.name} discards it.`, ok: `Start ${rt.name}`, danger: true });
    if (!ok) return;
  }
  if (!rt.slots.length) { toast(`Add ${rt.kind === "stretch" ? "stretches" : "exercises"} to ${rt.name} first.`); return editRoutine(rt.id); }
  const items = [];
  for (const slot of rt.slots) { const ex = exById(slot.exId); if (ex) items.push(makeItem(slot, ex, d, { fallback: true })); }
  S.edit = null;
  S.draft = { id: uid("lg"), type: rt.kind === "workout" ? "workout" : rt.kind, routineId: rt.id, title: rt.name, date: d, startedAt: nowISO(), notes: "", items };
  await saveDraftNow();
  openSession();
}

function editLogSession(log) {
  S.edit = Object.assign(clone(log), {
    items: log.items.map((it) => {
      const notDone = it.status === "skipped" && it.skipReason === "Not done";
      return Object.assign({ key: uid("it") }, clone(it), { status: notDone ? "open" : it.status, skipReason: notDone ? "" : it.skipReason || "" });
    })
  });
  editDirty = false;
  openSession();
}

// ---------- Overlay ----------
function sessionDom() { const el = $("#session"); return el && !el.hidden ? el : null; }
function openSession() {
  if (!cur()) return;
  closeAllSheets();
  S.sessionOpen = true;
  renderSession();
  $("#session").scrollTop = 0;
}
function closeSessionDom() {
  const el = $("#session");
  if (!el || el.hidden) return;
  el.hidden = true; el.innerHTML = "";
  document.documentElement.classList.remove("in-session");
}
function closeSession() { S.sessionOpen = false; S.edit = null; closeSessionDom(); render(); }

function countText(s) {
  const n = s.items.length, done = s.items.filter(E.performed).length, sk = s.items.filter((it) => it.status === "skipped").length;
  return `${done} of ${kindNoun(s.type, n)} done${sk ? `, ${sk} skipped` : ""}`;
}
function renderSession() {
  const s = cur(), el = $("#session");
  if (!s) return closeSessionDom();
  const editing = !!S.edit;
  el.hidden = false;
  document.documentElement.classList.add("in-session");
  el.innerHTML = `<header class="ses-head">
      <button class="icon-btn" data-sa="back" aria-label="${editing ? "Cancel changes" : "Back to Today. The session stays open."}">${editing ? ICON.x : ICON.left}</button>
      <div class="ses-title"><h1>${esc(s.title)}</h1><label class="ses-day"><span id="ses-day">${esc(dayWord(s.date))}</span>${ICON.down}<input type="date" data-sf="date" value="${s.date}" max="${S.today}" aria-label="Day of this session"></label></div>
      <button class="btn red sm" data-sa="finish">${editing ? "Save" : "Finish"}</button>
    </header>

      <p class="ses-count" id="ses-count">${esc(countText(s))}</p>

      <button class="btn ghost block" data-sa="add">${ICON.plus}Add ${s.type === "stretch" ? "a stretch" : "an exercise"}</button>
      ${field("Notes", `<textarea data-sf="notes" rows="3" maxlength="2000" placeholder="How it went">${esc(s.notes || "")}</textarea>`)}
      ${editing ? "" : `<button class="btn ghost danger-text block" data-sa="discard">${ICON.trash}Discard this session</button>`}
    </div>`;
}

function lastText(it, s) {
  const before = (e) => e.log.id !== s.id && e.log.date <= s.date && E.performed(e.item);
  const h = E.historyFor(S.logs, it.slotId, it.exId, s.id).filter(before);
  let e = h.length ? h[h.length - 1] : null, where = "";
  if (!e) {
    const any = E.exerciseHistory(S.logs, it.exId).filter(before);
    e = any.length ? any[any.length - 1] : null;
    if (e && e.log.title) where = ` in ${e.log.title}`;
  }
  return e ? `Last time${where}, ${E.fmtMD(e.log.date)}: ${E.setsSummary(e.item)}` : "";
}

function cardHtml(it, i, s) {
  const t = it.target || {};
  const pres = E.prescription(t, it.side);
  const allDone = it.sets.length > 0 && it.sets.every((x) => x.done);
  const more = `<button class="icon-btn" data-sa="menu" aria-label="More for ${esc(it.name)}">${ICON.more}</button>`;
  if (it.status === "skipped") {
    return `<article class="ex is-skipped" data-i="${i}"><div class="ex-head"><div class="ex-title"><h3>${esc(it.name)}</h3><p class="ex-skip">Skipped${it.skipReason ? `: ${esc(it.skipReason)}` : ""}</p>${it.skipNote ? `<p class="ex-note">${esc(it.skipNote)}</p>` : ""}</div><button class="btn ghost sm" data-sa="unskip">Undo skip</button></div></article>`;
  }
  if (s.type === "stretch") {
    return `<article class="ex st${allDone ? " is-done" : ""}" data-i="${i}">
      <button class="tick big${allDone ? " on" : ""}" data-sa="tick-all" aria-pressed="${allDone}" aria-label="${esc(it.name)} done">${ICON.check}</button>
      <div class="ex-title"><h3>${esc(it.name)}</h3><p class="ex-pres">${esc(pres)}</p>${it.plan ? `<p class="ex-plan">${esc(it.plan)}</p>` : ""}${it.note ? `<p class="ex-note">${esc(it.note)}</p>` : ""}</div>
      ${more}</article>`;
  }
  const steps = t.how === "steps" && t.stepCount > 1;
  const plainStep = /^Step \d/.test(t.delta || "");
  const tag = t.change === "up" && t.delta && !(steps && plainStep) ? `<span class="tag up">${esc(t.delta)}</span>` : t.change === "held" ? `<span class="tag held">Held</span>` : "";
  const origin = it.swappedFrom ? `<p class="ex-origin">${ICON.swap}Swapped in for ${esc((exById(it.swappedFrom) || {}).name || "another exercise")}</p>` : it.added ? `<p class="ex-origin">${ICON.plus}Added for this session</p>` : "";
  const cols = it.exType === "weights" ? "<span>lb</span><span>Reps</span>" : it.exType === "timed" ? "<span>Seconds</span>" : "<span>Reps</span>";
  const wide = it.exType === "weights" ? " two" : "";
  const hint = /^First time: enter/.test(it.hint || "") && it.sets.some((x) => x.load !== null && x.load !== undefined) ? "First time" : it.hint;
  const meta = [hint && (t.change !== "up" || t.plateUp) ? hint : "", lastText(it, s)].filter(Boolean);
  const how = t.how || "none";
  const nextSel = how === "none" ? "" : `<label class="next-sel"><span>Next time</span><select data-sf="next"><option value=""${!it.next ? " selected" : ""}>Auto</option><option value="up"${it.next === "up" ? " selected" : ""}>Go up</option><option value="hold"${it.next === "hold" ? " selected" : ""}>Stay the same</option></select></label>`;
  return `<article class="ex${allDone ? " is-done" : ""}" data-i="${i}">
    <div class="ex-head"><div class="ex-title"><h3>${esc(it.name)}</h3><p class="ex-pres">${esc(pres)}${steps ? ` <span class="${t.change === "up" && plainStep ? "tag up" : "step"}">Step ${t.step + 1} of ${t.stepCount}</span>` : ""}${tag}</p>${origin}</div>${more}</div>
    ${it.plan ? `<p class="ex-plan">${esc(it.plan)}</p>` : ""}
    <div class="sets${wide}" role="group" aria-label="Sets for ${esc(it.name)}">
      <div class="set-h"><span>Set</span>${cols}<span></span></div>
      ${it.sets.map((x, si) => setRow(it, x, si)).join("")}
    </div>
    <div class="ex-foot"><button class="link" data-sa="add-set">${ICON.plus}Add set</button>${nextSel}</div>
    ${meta.length ? `<p class="ex-meta">${meta.map(esc).join("<br>")}</p>` : ""}
    ${it.note ? `<p class="ex-note">${esc(it.note)}</p>` : ""}
  </article>`;
}
function setRow(it, x, si) {
  const ph = it.target && it.target.plateUp ? ' placeholder="New"' : "";
  const f = (k, label, mode) => `<input class="num" data-sf="${k}" data-s="${si}" inputmode="${mode}" autocomplete="off" enterkeyhint="done" value="${x[k] === null || x[k] === undefined ? "" : esc(E.fmtNum(x[k]))}"${k === "load" ? ph : ""} aria-label="Set ${si + 1} ${label}">`;
  const cells = it.exType === "weights" ? f("load", "weight in pounds", "decimal") + f("reps", "reps", "numeric") : it.exType === "timed" ? f("secs", "seconds", "numeric") : f("reps", "reps", "numeric");
  return `<div class="set${x.done ? " is-done" : ""}" data-s="${si}"><span class="set-n">${si + 1}</span>${cells}<button class="tick${x.done ? " on" : ""}" data-sa="tick" data-s="${si}" aria-pressed="${x.done}" aria-label="Set ${si + 1} done">${ICON.check}</button></div>`;
}

// Something in the session changed: redraw that card, keep focus, save.
function touched(i, redraw) {
  const s = cur();
  if (!s) return;
  if (i !== undefined && i >= 0 && redraw !== false) {
    const old = $(`#session [data-i="${i}"]`);
    if (old) {
      const a = document.activeElement, inCard = a && old.contains(a);
      const key = inCard ? (a.dataset.sa ? `[data-sa="${a.dataset.sa}"]` : a.dataset.sf ? `[data-sf="${a.dataset.sf}"]` : "") + (a.dataset.s !== undefined ? `[data-s="${a.dataset.s}"]` : "") : "";
      old.outerHTML = cardHtml(s.items[i], i, s);
      if (key) { const n = $(`#session [data-i="${i}"] ${key}`); if (n) n.focus({ preventScroll: true }); }
    }
  }
  const c = $("#ses-count"); if (c) c.textContent = countText(s);
  if (S.edit) editDirty = true; else saveDraftSoon();
}

function cleanNum(k, v) {
  const n = E.num(v);
  if (n === null || n < 0) return null;
  if (k === "load") return Math.min(2000, E.r2(n));
  return Math.min(k === "secs" ? 36000 : 1000, Math.round(n));
}

const ses = $("#session");
ses.addEventListener("click", (e) => {
  const b = e.target.closest("[data-sa]");
  const s = cur();
  if (!b || !s) return;
  const card = b.closest("[data-i]"), i = card ? Number(card.dataset.i) : -1, it = i >= 0 ? s.items[i] : null;
  const a = b.dataset.sa;
  if (a === "back") return sessionBack();
  if (a === "finish") return finishSheet();
  if (a === "discard") return discardSession();
  if (a === "add") return addToSession();
  if (!it) return;
  if (a === "tick") { const x = it.sets[Number(b.dataset.s)]; if (x) { x.done = !x.done; touched(i); } }
  else if (a === "tick-all") { const all = it.sets.length > 0 && it.sets.every((x) => x.done); if (!it.sets.length) it.sets.push({ load: null, reps: null, secs: it.target && it.target.secs, done: false }); it.sets.forEach((x) => { x.done = !all; }); touched(i); }
  else if (a === "add-set") { const last = it.sets[it.sets.length - 1] || {}; it.sets.push({ load: last.load === undefined ? null : last.load, reps: last.reps === undefined ? null : last.reps, secs: last.secs === undefined ? null : last.secs, done: false }); touched(i); const r = $$(`#session [data-i="${i}"] .set`); const nIn = r.length && $("input", r[r.length - 1]); if (nIn) nIn.focus(); }
  else if (a === "unskip") { it.status = "open"; it.skipReason = ""; it.skipNote = ""; touched(i); }
  else if (a === "menu") itemMenu(i);
});
ses.addEventListener("input", (e) => {
  const inp = e.target, k = inp.dataset && inp.dataset.sf, s = cur();
  if (!k || !s) return;
  if (k === "notes") { s.notes = inp.value; touched(); return; }
  if (k === "load" || k === "reps" || k === "secs") {
    const card = inp.closest("[data-i]"), it = s.items[Number(card.dataset.i)], x = it && it.sets[Number(inp.dataset.s)];
    if (x) { x[k] = cleanNum(k, inp.value); touched(Number(card.dataset.i), false); }
  }
});
ses.addEventListener("change", (e) => {
  const inp = e.target, k = inp.dataset && inp.dataset.sf, s = cur();
  if (!k || !s) return;
  if (k === "date") {
    if (E.isDate(inp.value) && inp.value <= S.today) { s.date = inp.value; touched(); const l = $("#ses-day"); if (l) l.textContent = dayWord(s.date); }
    else inp.value = s.date;
    return;
  }
  const card = inp.closest("[data-i]");
  if (!card) return;
  const i = Number(card.dataset.i), it = s.items[i];
  if (k === "next") { it.next = inp.value === "up" || inp.value === "hold" ? inp.value : null; touched(i, false); return; }
  if (k === "load" || k === "reps" || k === "secs") {
    const si = Number(inp.dataset.s), x = it.sets[si];
    const was = cleanNum(k, inp.defaultValue), now = x[k];
    inp.value = now === null ? "" : E.fmtNum(now);
    inp.defaultValue = inp.value;
    // A new weight or time carries down to the sets below that still had the old one
    if (k !== "reps") {
      for (let j = si + 1; j < it.sets.length; j++) {
        const y = it.sets[j];
        if (y.done || !E.eqNum(y[k], was)) continue;
        y[k] = now;
        const other = $(`#session [data-i="${i}"] input[data-sf="${k}"][data-s="${j}"]`);
        if (other) { other.value = inp.value; other.defaultValue = inp.value; }
      }
    }
    touched(i, false);
  }
});

function itemMenu(i) {
  const s = cur(), it = s.items[i];
  const opts = [["swap", "Swap it", "For today only, or for good"]];
  if (it.status !== "skipped") opts.push(["skip", "Skip it", "Add why, if you want"]);
  opts.push(["note", it.note ? "Edit note" : "Add a note", it.note ? it.note.slice(0, 60) : "Saved with this session"]);
  if (it.sets.length > 1) opts.push(["remove-set", "Remove last set", ""]);
  if (it.added) opts.push(["remove", `Remove from ${s.title}`, ""]);
  choiceSheet(it.name, opts, (k) => {
    if (k === "swap") swapItem(i);
    else if (k === "skip") skipSheet(i);
    else if (k === "note") noteSheet(i);
    else if (k === "remove-set") { it.sets.pop(); touched(i); }
    else if (k === "remove") { s.items.splice(i, 1); renderSession(); touched(); }
  });
}

function skipSheet(i) {
  const s = cur(), it = s.items[i];
  const sh = openSheet({ title: `Skip ${it.name}` });
  sh.body.innerHTML = `<div class="field"><span class="field-l">Why?</span>${chips("why", SKIP_REASONS, "")}</div>${field("Note", `<textarea id="sk-note" rows="3" maxlength="300" placeholder="Optional, like what hurt or what you did instead"></textarea>`)}`;
  const pick = () => {}; pick.toggle = true;
  wireChips(sh.body, "why", pick);
  sh.setFoot(`<button class="btn red block" id="sk-go">Skip ${s.type === "stretch" ? "stretch" : "exercise"}</button>`);
  $("#sk-go", sh.foot).onclick = () => {
    it.status = "skipped"; it.skipReason = chipValue(sh.body, "why"); it.skipNote = $("#sk-note", sh.body).value.trim();
    sh.close(true); touched(i);
  };
}
function noteSheet(i) {
  const it = cur().items[i];
  const sh = openSheet({ title: `Note for ${it.name}`, focus: true });
  sh.body.innerHTML = field("Note", `<textarea id="nt-text" rows="4" maxlength="500" placeholder="Seat height, grip, how it felt">${esc(it.note || "")}</textarea>`);
  sh.setFoot(`<button class="btn red block" id="nt-save">Save note</button>`);
  setTimeout(() => $("#nt-text", sh.body).focus(), 60);
  $("#nt-save", sh.foot).onclick = () => { it.note = $("#nt-text", sh.body).value.trim(); sh.close(true); touched(i); };
}

function sessionSlot(s, it) { const rt = rtById(s.routineId); return rt ? rt.slots.find((x) => x.id === it.slotId) || null : null; }
function swapItem(i) {
  const s = cur(), it = s.items[i], rt = rtById(s.routineId), slot = sessionSlot(s, it);
  pickExercise({ title: `Swap ${it.name} for…`, exclude: it.exId, kind: rt ? rt.kind : s.type }, (ex) => {
    if (!slot || it.added || S.edit) return applySwap(i, ex, "today");
    choiceSheet(`Swap in ${ex.name}`, [["today", "Just today", `${it.name} stays in ${rt.name}`], ["routine", `For good`, `${ex.name} replaces ${it.name} in ${rt.name}`]], (k) => applySwap(i, ex, k));
  });
}
function applySwap(i, ex, scope) {
  const s = cur(), it = s.items[i], slot = sessionSlot(s, it);
  const base = slot ? clone(slot) : { id: it.slotId, sets: (it.target && it.target.sets) || it.sets.length || 3, reps: it.target && it.target.reps, secs: it.target && it.target.secs, step: 0, at: "", prog: null };
  if (scope === "routine" && slot) { slot.exId = ex.id; slot.load = null; slot.at = nowISO(); savePlan(); }
  // Back to the routine's own exercise: its own weight; anything else starts from that exercise's last weight
  const tslot = slot && slot.exId === ex.id ? clone(slot) : Object.assign(base, { exId: ex.id, load: null });
  const fresh = makeItem(tslot, ex, s.date, { fallback: true, excludeLogId: s.id });
  const orig = it.swappedFrom || it.exId;
  fresh.key = it.key; fresh.added = it.added; fresh.note = it.note;
  if (scope !== "routine" && orig !== ex.id) fresh.swappedFrom = orig;
  s.items[i] = fresh;
  touched(i);
  toast(scope === "routine" ? `${ex.name} is in ${rtById(s.routineId).name} from now on` : `Swapped in ${ex.name} for today`);
}

function addToSession() {
  const s = cur(), rt = rtById(s.routineId);
  pickExercise({ title: s.type === "stretch" ? "Add a stretch" : "Add an exercise", kind: rt ? rt.kind : s.type }, (ex) => {
    const add = (scope) => {
      const slot = E.newSlot(ex.id, slotDefaults(ex, rt ? rt.kind : s.type), S.settings);
      if (rt && rt.kind === "physio") slot.prog.when = "manual";
      if (scope === "routine" && rt) { rt.slots.push(slot); savePlan(); }
      else slot.id = uid("xs");
      const item = makeItem(slot, ex, s.date, { fallback: true, excludeLogId: s.id });
      if (scope !== "routine") item.added = true;
      s.items.push(item);
      renderSession(); touched();
      const el = $(`#session [data-i="${s.items.length - 1}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    };
    if (!rt || S.edit) return add("today");
    choiceSheet(`Add ${ex.name}`, [["today", "Just this session", ""], ["routine", `Add to ${rt.name}`, "It loads every time from now on"]], add);
  });
}
function slotDefaults(ex, kind) {
  if (ex.type === "timed") return kind === "stretch" ? { sets: 2, secs: 30, how: "none" } : { sets: 3, secs: 30 };
  return kind === "stretch" ? { sets: 2, reps: { min: 10, max: 10 }, how: "none" } : { sets: 3, reps: { min: 8, max: 12 } };
}

async function sessionBack() {
  if (S.edit) {
    if (editDirty && !(await confirmBox({ title: "Discard your changes?", body: "The session stays as it was saved.", ok: "Discard changes", cancel: "Keep editing", danger: true }))) return;
    closeSession();
    return;
  }
  saveDraftNow();
  closeSession();
}
async function discardSession() {
  const s = S.draft;
  if (!s || !(await confirmBox({ title: `Discard ${s.title}?`, body: "Everything ticked in this session will be lost.", ok: "Discard", danger: true }))) return;
  S.draft = null; saveDraftNow(); closeSession();
  toast(`${s.title} discarded`, { label: "Undo", run: () => { S.draft = s; saveDraftNow(); render(); } });
}

function suggestMinutes(s) {
  if (!s.startedAt || s.date !== S.today) return "";
  const m = Math.round((Date.now() - new Date(s.startedAt).getTime()) / 60000);
  return m >= 5 && m <= 300 ? m : "";
}
function finishSheet() {
  const s = cur();
  if (!E.isDate(s.date) || s.date > S.today) return toast("Pick a day up to today.");
  const done = s.items.filter(E.performed), skipped = s.items.filter((it) => it.status === "skipped"), open = s.items.filter((it) => it.status !== "skipped" && !E.performed(it));
  const editing = !!S.edit;
  const sh = openSheet({ title: editing ? `Save ${s.title}` : `Finish ${s.title}` });
  const mins = editing ? (s.minutes || "") : suggestMinutes(s);
  sh.body.innerHTML = `<ul class="fin">
      <li><strong>${done.length}</strong> of ${esc(kindNoun(s.type, s.items.length))} done</li>
      ${skipped.length ? `<li>Skipped: ${esc(listJoin(skipped.map((x) => x.name)))}</li>` : ""}
      ${open.length ? `<li class="warn">Nothing ticked for ${esc(listJoin(open.map((x) => x.name)))}. ${open.length === 1 ? "It's" : "They're"} saved as not done.</li>` : ""}
    </ul>
    ${field("How long", `<span class="unit-in"><input id="fn-min" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="${esc(mins)}" placeholder="Optional"><span>min</span></span>`)}
    <p class="form-err" id="fn-err" role="alert" hidden></p>`;
  sh.setFoot(`<button class="btn ghost" data-close>Keep going</button><button class="btn red" id="fn-save">${editing ? "Save changes" : `Save ${s.type === "workout" ? "workout" : "session"}`}</button>`);
  $("[data-close]", sh.foot).onclick = () => sh.close();
  $("#fn-save", sh.foot).onclick = async () => {
    const v = $("#fn-min", sh.body).value.trim(), m = v ? E.num(v) : null;
    if (v && (m === null || m < 1 || m > 1440 || Math.round(m) !== m)) { const er = $("#fn-err", sh.body); er.textContent = "Enter the minutes as a whole number."; er.hidden = false; return; }
    sh.close(true);
    await saveSession(m);
  };
}
async function saveSession(minutes) {
  const s = cur(), editing = !!S.edit;
  const items = s.items.map((it) => {
    const perf = E.performed(it);
    const o = {
      slotId: it.slotId, exId: it.exId, name: it.name, exType: it.exType, equip: it.equip, side: !!it.side,
      status: perf ? "done" : "skipped", skipReason: perf ? "" : it.status === "skipped" ? it.skipReason || "" : "Not done", skipNote: perf ? "" : it.skipNote || "",
      note: it.note || "", target: it.target, sets: it.sets.map((x) => ({ load: x.load === undefined ? null : x.load, reps: x.reps === undefined ? null : x.reps, secs: x.secs === undefined ? null : x.secs, done: !!x.done })), next: it.next || null
    };
    if (it.swappedFrom) o.swappedFrom = it.swappedFrom;
    if (it.added) o.added = true;
    return o;
  });
  const log = { id: s.id, date: s.date, type: s.type, title: s.title, routineId: s.routineId || null, split: s.type === "workout", minutes: minutes || null, notes: (s.notes || "").trim(), items, created_at: editing ? s.created_at : nowISO() };
  if (editing) log.updated_at = nowISO();
  try { await putLog(log); } catch (e) { return saveErr(e); }
  if (editing) { closeSession(); toast("Changes saved"); return; }
  const draft = S.draft;
  S.draft = null; await saveDraftNow();
  closeSession();
  const nx = log.type === "workout" ? nextRoutine() : null;
  toast(`${log.title} saved${nx ? `. Next up: ${nx.name}` : ""}`, { label: "Undo", run: async () => { try { await removeLog(log.id); } catch (e) { return saveErr(e); } S.draft = draft; saveDraftNow(); render(); } });
}

/* Calendar: any month or week, each day's activities, and every logged session in detail. */
function viewCalendar() {
  const C = S.cal;
  if (!C.month) C.month = E.monthKey(S.today);
  if (!C.week) C.week = E.weekStart(S.today);
  const seg = `<div class="seg" role="group" aria-label="Show">${[["month", "Month"], ["week", "Week"]].map(([k, l]) => `<button data-act="cal-mode" data-m="${k}" aria-pressed="${C.mode === k}">${l}</button>`).join("")}</div>`;
  return `<div class="page-top"><h1 class="page-h">Calendar</h1>${seg}</div>${C.mode === "week" ? weekView() : monthView()}`;
}
function byDate(a, b) {
  const m = {};
  for (const l of S.logs) if (l.date >= a && l.date <= b) (m[l.date] = m[l.date] || []).push(l);
  return m;
}
function monthView() {
  const mk = S.cal.month, first = `${mk}-01`, n = E.daysInMonth(mk), last = `${mk}-${E.pad(n)}`;
  const days = byDate(first, last), lead = E.dayIndex(first);
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(`<span class="cd blank" aria-hidden="true"></span>`);
  for (let d = 1; d <= n; d++) {
    const date = `${mk}-${E.pad(d)}`, ls = days[date] || [];
    cells.push(`<button class="cd${date === S.today ? " is-today" : ""}${date > S.today ? " is-future" : ""}${ls.length ? " has" : ""}" data-act="day" data-date="${date}" aria-label="${esc(E.fmtDayLong(date))}: ${esc(ls.length ? ls.map(logTitle).join(", ") : "nothing logged")}"><span class="cd-d">${d}</span><span class="cd-dots">${dots(ls, 3)}</span></button>`);
  }
  while (cells.length % 7) cells.push(`<span class="cd blank" aria-hidden="true"></span>`);
  const c = E.countByType(S.logs, first, last);
  const isNow = mk === E.monthKey(S.today);
  return `<div class="cnav"><button class="icon-btn" data-act="cal-step" data-d="-1" aria-label="Previous month">${ICON.left}</button><button class="ctitle" data-act="cal-pick" aria-label="${esc(E.fmtMonth(mk))}. Pick a month">${esc(E.fmtMonth(mk))}${ICON.down}</button><button class="icon-btn" data-act="cal-step" data-d="1" aria-label="Next month">${ICON.right}</button>${isNow ? "" : `<button class="btn ghost sm" data-act="cal-now">This month</button>`}</div>
    <div class="mgrid"><div class="mhead" aria-hidden="true">${E.DOW.map((d) => `<span>${d}</span>`).join("")}</div><div class="mcells">${cells.join("")}</div></div>
    <section class="sect"><h2 class="h2">${esc(E.MONTHS_LONG[+mk.slice(5) - 1])} in total</h2>${c.total ? `<ul class="totals">${E.TYPES.filter((t) => c[t]).map((t) => `<li>${badge(t)}<span>${E.TYPE_LABEL[t]}</span><strong>${c[t]}</strong><span class="muted">${c.minutes[t] ? esc(E.fmtMinutes(c.minutes[t])) : ""}</span></li>`).join("")}</ul>` : `<p class="empty">Nothing logged in ${esc(E.fmtMonth(mk))}.</p>`}</section>`;
}
function weekView() {
  const ws = S.cal.week, we = E.addDays(ws, 6), days = byDate(ws, we);
  const isNow = ws === E.weekStart(S.today);
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = E.addDays(ws, i), ls = days[d] || [];
    rows.push(`<section class="wk${d === S.today ? " is-today" : ""}"><button class="wk-h" data-act="day" data-date="${d}"><span>${E.DOW_LONG[i]}</span><span class="muted">${esc(E.fmtMD(d))}</span></button>${ls.length ? `<ul class="loglist">${ls.map((l) => logRow(l)).join("")}</ul>` : d <= S.today ? `<p class="wk-none">Rest day</p>` : ""}</section>`);
  }
  const c = E.countByType(S.logs, ws, we);
  return `<div class="cnav"><button class="icon-btn" data-act="cal-step" data-d="-1" aria-label="Previous week">${ICON.left}</button><span class="ctitle static">${esc(E.fmtRange(ws, we))}${ws.slice(0, 4) !== S.today.slice(0, 4) ? `, ${ws.slice(0, 4)}` : ""}</span><button class="icon-btn" data-act="cal-step" data-d="1" aria-label="Next week">${ICON.right}</button>${isNow ? "" : `<button class="btn ghost sm" data-act="cal-now">This week</button>`}</div>
    <p class="week-sum">${c.total ? esc(typeCountText(c)) : "Nothing logged this week."}</p>
    <div class="wklist">${rows.join("")}</div>`;
}
ACT["cal-mode"] = (el) => {
  const C = S.cal, m = el.dataset.m;
  if (C.mode === m) return;
  if (m === "week") { const sel = C.month === E.monthKey(S.today) ? S.today : `${C.month}-01`; C.week = E.weekStart(sel); }
  else C.month = E.monthKey(E.addDays(C.week, 3));
  C.mode = m; saveUi(); render();
};
ACT["cal-step"] = (el) => {
  const d = Number(el.dataset.d);
  if (S.cal.mode === "week") S.cal.week = E.addDays(S.cal.week, 7 * d); else S.cal.month = E.addMonths(S.cal.month, d);
  render();
};
ACT["cal-now"] = () => { S.cal.month = E.monthKey(S.today); S.cal.week = E.weekStart(S.today); render(); };
ACT["cal-pick"] = () => {
  let y = +S.cal.month.slice(0, 4);
  const sh = openSheet({ title: "Pick a month" });
  function draw() {
    sh.body.innerHTML = `<div class="ypick"><button class="icon-btn" data-y="-1" aria-label="Previous year">${ICON.left}</button><strong>${y}</strong><button class="icon-btn" data-y="1" aria-label="Next year">${ICON.right}</button></div>
      <div class="mpick">${E.MONTHS.map((m, i) => { const mk = `${y}-${E.pad(i + 1)}`; const n = S.logs.filter((l) => l.date.startsWith(mk)).length; return `<button class="mp${mk === S.cal.month ? " on" : ""}${mk === E.monthKey(S.today) ? " now" : ""}" data-mk="${mk}" aria-label="${E.MONTHS_LONG[i]} ${y}${n ? `, ${plural(n, "activity", "activities")}` : ""}"><span>${m}</span><small>${n || ""}</small></button>`; }).join("")}</div>`;
    $$("[data-y]", sh.body).forEach((b) => { b.onclick = () => { y += Number(b.dataset.y); draw(); $(`[data-y="${b.dataset.y}"]`, sh.body).focus(); }; });
